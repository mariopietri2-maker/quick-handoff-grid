<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fresh Delivery — Native Apps · All Screens</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; font-family: 'Segoe UI', system-ui, sans-serif; background: #0a0d0b; }
  header {
    display: flex; align-items: center; gap: 14px; padding: 14px 20px;
    background: #101412; border-bottom: 1px solid #1e2621; flex-wrap: wrap;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; font-weight: 800; color: #fff; font-size: 15px;
  }
  .logo {
    width: 32px; height: 32px; border-radius: 10px;
    background: linear-gradient(135deg, #06C167, #007A3D);
    display: flex; align-items: center; justify-content: center; color: #fff; font-size: 16px;
  }
  .tabs { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
  .tab {
    display: flex; align-items: center; gap: 8px; padding: 9px 16px; border-radius: 12px;
    background: #1a201c; color: #9aa6a0; font-size: 13px; font-weight: 700; cursor: pointer;
    border: 1px solid #262d28; transition: all .15s ease;
  }
  .tab .app { width: 22px; height: 22px; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .tab.driver .app { background: rgba(6,193,103,.18); color: #2FE795; }
  .tab.customer .app { background: rgba(124,108,255,.18); color: #b4a8ff; }
  .tab:hover { color: #e6ede8; border-color: #343d36; }
  .tab.active { background: #06C167; color: #fff; border-color: #06C167; }
  .tab.active .app { background: rgba(0,0,0,.22); color: #fff; }
  .note { color: #67716b; font-size: 12px; margin-left: 4px; }
  .frames { height: calc(100vh - 61px); display: flex; }
  .frame-wrap { flex: 1; min-width: 0; position: relative; }
  .frame-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
  .frame-label {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 11px; font-weight: 700; color: #9aa6a0; background: rgba(10,13,11,.8);
    border: 1px solid #262d28; border-radius: 999px; padding: 6px 14px; pointer-events: none;
    backdrop-filter: blur(6px);
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">F</div> Fresh Delivery · Native Apps</div>
  <div class="tabs">
    <div class="tab driver active" data-app="driver"><span class="app">🛵</span> Driver App <span class="note">11 screens</span></div>
    <div class="tab customer" data-app="customer"><span class="app">🛍️</span> Customer App <span class="note">9 screens</span></div>
  </div>
</header>
<div class="frames">
  <div class="frame-wrap" id="wrap-driver">
    <div class="frame-label">Driver · public/driver-ui-preview.html</div>
    <iframe src="public/driver-ui-preview.html" title="Driver App Preview"></iframe>
  </div>
  <div class="frame-wrap hidden" id="wrap-customer">
    <div class="frame-label">Customer · customer-redesign-preview.html</div>
    <iframe src="customer-redesign-preview.html" title="Customer App Preview"></iframe>
  </div>
</div>
<script>
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () {
      document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('active'); });
      document.querySelectorAll('.frame-wrap').forEach(function (f) { f.classList.add('hidden'); });
      t.classList.add('active');
      document.getElementById('wrap-' + t.dataset.app).classList.remove('hidden');
    });
  });
</script>
</body>
</html>
