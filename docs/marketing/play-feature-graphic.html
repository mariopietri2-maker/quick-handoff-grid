<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8"/>
<title>Fresh2GO Feature Graphic 1024×500</title>
<style>
  body { margin: 0; background: #222; display: flex; justify-content: center; padding: 24px; font-family: system-ui, sans-serif; }
  .canvas {
    width: 1024px; height: 500px;
    background: linear-gradient(135deg, #1A0D02 0%, #3D1F0A 40%, #FF8A3D 100%);
    color: #fff; display: flex; align-items: center; justify-content: space-between;
    padding: 48px 64px; box-sizing: border-box; border-radius: 8px;
  }
  h1 { font-size: 72px; margin: 0 0 12px; letter-spacing: -1px; }
  p { font-size: 28px; margin: 0; opacity: 0.92; }
  .badge { margin-top: 24px; display: inline-block; background: #fff; color: #1A0D02;
    padding: 10px 20px; border-radius: 999px; font-weight: 700; font-size: 18px; }
</style>
</head>
<body>
  <div class="canvas">
    <div>
      <h1>Fresh2GO</h1>
      <p>Fresh Meals. Fast Delivery.</p>
      <div class="badge">Φρέσκο · Γρήγορα · Τοπικά</div>
    </div>
  </div>
</body>
</html>
