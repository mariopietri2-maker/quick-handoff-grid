name: Apply Ioannina map hide inactive
on:
  push:
    paths:
      - 'scripts/apply_ioannina_map_hide_inactive.py'
      - '.github/workflows/apply-ioannina-map-hide-inactive.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_ioannina_map_hide_inactive.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminIoanninaMap.tsx
          git commit -m "fix(admin): Ioannina map hides inactive/off-shift drivers and inactive stores" || exit 0
          git push
