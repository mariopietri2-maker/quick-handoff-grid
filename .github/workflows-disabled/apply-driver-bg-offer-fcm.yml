name: Apply driver background offer FCM
on:
  push:
    paths:
      - 'scripts/apply_driver_bg_offer_fcm.py'
      - '.github/workflows/apply-driver-bg-offer-fcm.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_driver_bg_offer_fcm.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/send-push/index.ts native-driver/ src/lib/apk-downloads.ts
          git commit -m "fix(driver): background order offers use system FCM notification (2.6.17)" || exit 0
          git push
