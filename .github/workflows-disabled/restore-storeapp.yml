name: Restore StoreApp

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore StoreApp from good commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout 647fa6c70b35ee869ca16efd56d3081509c6af04 -- src/pages/StoreApp.tsx
          git add src/pages/StoreApp.tsx
          git status
          git commit -m "fix(store): restore StoreApp from 647fa6c" || { echo "nothing to commit"; exit 0; }
          git push origin HEAD:main
