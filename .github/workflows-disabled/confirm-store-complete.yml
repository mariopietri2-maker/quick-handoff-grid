name: Confirm complete store call
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/home/HomeScreen.kt')
          t = p.read_text()
          if 'Ολοκλήρωση κλήσης;' in t:
              print('already')
          else:
              needle = 'onClick = onComplete,'
              # Only the ActiveJobCard complete button (between ActiveJobCard and StoreCallSheet)
              i = t.find('private fun ActiveJobCard')
              j = t.find('private fun StoreCallSheet')
              if i < 0 or j < 0:
                  raise SystemExit('markers missing')
              chunk = t[i:j]
              if 'onClick = onComplete,' not in chunk:
                  raise SystemExit('button missing')
              chunk2 = chunk.replace(
                  'private fun ActiveJobCard(\n    active: ActiveStoreCallRow,\n    busy: Boolean,\n    onComplete: () -> Unit,\n) {\n    Card(',
                  'private fun ActiveJobCard(\n    active: ActiveStoreCallRow,\n    busy: Boolean,\n    onComplete: () -> Unit,\n) {\n    var confirmOpen by remember { mutableStateOf(false) }\n\n    Card(',
                  1,
              )
              chunk2 = chunk2.replace(
                  'onClick = onComplete,',
                  'onClick = { confirmOpen = true },',
                  1,
              )
              dialog = '''
    if (confirmOpen) {
        AlertDialog(
            onDismissRequest = { if (!busy) confirmOpen = false },
            title = { Text("Ολοκλήρωση κλήσης;", fontWeight = FontWeight.Bold) },
            text = {
                Text(
                    "Επιβεβαιώνεις ότι ολοκλήρωσες την κλήση στο ${active.store_name};\nΜετά δεν θα μπορείς να την ανοίξεις ξανά.",
                    fontSize = 14.sp,
                )
            },
            confirmButton = {
                Button(
                    onClick = {
                        confirmOpen = false
                        onComplete()
                    },
                    enabled = !busy,
                    shape = RoundedCornerShape(16.dp),
                    colors = ButtonDefaults.buttonColors(containerColor = GreenBtn),
                ) {
                    Text("Ναι, ολοκληρώθηκε", fontWeight = FontWeight.Bold)
                }
            },
            dismissButton = {
                TextButton(onClick = { confirmOpen = false }, enabled = !busy) {
                    Text("Όχι", color = TextMuted)
                }
            },
        )
    }
'''
              # insert dialog before closing of function (last closing brace of chunk)
              # chunk ends before StoreCallSheet; ends with }\n\n
              if not chunk2.rstrip().endswith('}'):
                  raise SystemExit('unexpected chunk end')
              # replace final } of ActiveJobCard with dialog + }
              idx = chunk2.rstrip().rfind('}')
              chunk2 = chunk2.rstrip()[:idx] + dialog + '}\n\n'
              t = t[:i] + chunk2 + t[j:]
              p.write_text(t)
              print('patched')
          f = Path('native-driver/app/build.gradle.kts')
          ft = f.read_text()
          ft = ft.replace('versionCode = 260', 'versionCode = 261')
          ft = ft.replace('versionName = "2.6.9-native"', 'versionName = "2.6.10-native"')
          f.write_text(ft)
          print('version', [ln for ln in ft.splitlines() if 'version' in ln][:4])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(driver): confirm before completing N-store call (2.6.10)" || true
          git push
