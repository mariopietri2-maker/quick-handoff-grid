name: Apply driver support topic
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and push
        run: |
          set -euo pipefail
          python3 scripts/apply_driver_support_topic.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "feat(support): driver topic before live chat; only support closes" || true
          git push
