name: Fix OrderQueue cancel
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-orderqueue-cancel.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Replace cancel handler
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('src/components/store/OrderQueue.tsx')
          t = p.read_text(encoding='utf-8')
          if "onStatusUpdate(order.id, 'cancelled')" in t:
              print('already fixed')
          else:
              key = "p_new_status: 'cancelled'"
              idx = t.find(key)
              if idx < 0:
                  raise SystemExit('key not found')
              # find start of onClick={async
              start = t.rfind('onClick={async () => {', 0, idx)
              end = t.find('className="bg-destructive', idx)
              if start < 0 or end < 0:
                  raise SystemExit(f'bounds start={start} end={end}')
              new_block = """onClick={async () => {
                        const ok = await onStatusUpdate(order.id, 'cancelled');
                        if (ok === false) toast.error('Η ακύρωση απέτυχε');
                        else toast.success('Παραγγελία ακυρώθηκε');
                      }}
                      """
              t = t[:start] + new_block + t[end:]
              p.write_text(t, encoding='utf-8')
              print('patched at', start)
          assert "onStatusUpdate(order.id, 'cancelled')" in p.read_text(encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/OrderQueue.tsx
          if git diff --staged --quiet; then echo no changes; else git commit -m "fix(store): cancel order via onStatusUpdate to stop sound"; git push; fi
