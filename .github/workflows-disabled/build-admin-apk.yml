name: Build Admin APK

on:
  workflow_dispatch:
  push:
    paths:
      - "native-admin/**"
      - ".github/workflows/build-admin-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build admin APK
        working-directory: native-admin
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../fresh2go-admin-native-debug.apk
          ls -lah ../fresh2go-admin-native-debug.apk
      - name: Publish to mobile-apks-v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Meal Android APKs" --notes "Native APKs"
          gh release upload mobile-apks-v1 fresh2go-admin-native-debug.apk --clobber
          echo "Uploaded:"
          gh release view mobile-apks-v1 --json assets --jq '.assets[].name'
