name: Ensure 281 and rebuild APK
on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/VERSION.txt"
      - ".github/workflows/ensure-281-and-rebuild.yml"
jobs:
  ensure:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Force gradle version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('native-driver/app/build.gradle.kts')
          t = p.read_text()
          t2 = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 281', t, count=1)
          t2 = re.sub(r'versionName\s*=\s*"[^"]*"', 'versionName = "2.6.27-bg-offer"', t2, count=1)
          p.write_text(t2)
          for line in p.read_text().splitlines():
              if 'versionCode' in line or 'versionName' in line:
                  print(line.strip())
          PY
      - name: Commit if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-driver/app/build.gradle.kts
          if git diff --staged --quiet; then echo already 281; else git commit -m "chore(driver): ensure versionCode 281"; git push; fi
