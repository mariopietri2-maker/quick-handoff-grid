name: Fix native customer place order
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fix-customer-place-order.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch repository + cart payment UI
        run: |
          python3 << 'PY'
          from pathlib import Path

          repo = Path('native-customer/app/src/main/java/com/freshdelivery/nativecustomer/data/CustomerRepository.kt')
          t = repo.read_text(encoding='utf-8')
          old = '''        val raw = client.postgrest.rpc(
            "place_order",
            buildJsonObject {
                put("p_store_id", storeId)
                put(
                    "p_items",
                    buildJsonArray {
                        items.forEach { add(
                            buildJsonObject {
                                put("menu_item_id", it.menuItemId)
                                put("quantity", it.quantity)
                            },
                        ) }
                    },
                )
                put("p_delivery_address", deliveryAddress)
                put("p_delivery_latitude", deliveryLat)
                put("p_delivery_longitude", deliveryLng)
                put("p_payment_method", paymentMethod)
                put("p_tip_amount", tipAmount)
                put("p_delivery_fee", deliveryFee)
                put("p_notes", notes)
                put("p_scheduled_for", JsonNull)
                put("p_distance_km", distanceKm)
                put("p_promo_code", promoCode)
            },
        ).decodeSingle<String>()
        return raw'''
          new = '''        // place_order returns a bare UUID string (not a JSON array).
        // decodeSingle/decodeList expect '[' and crash with:
        //   Expected start of the array '[', but had '"'
        val response = client.postgrest.rpc(
            "place_order",
            buildJsonObject {
                put("p_store_id", storeId)
                put(
                    "p_items",
                    buildJsonArray {
                        items.forEach { add(
                            buildJsonObject {
                                put("menu_item_id", it.menuItemId)
                                put("quantity", it.quantity)
                            },
                        ) }
                    },
                )
                put("p_delivery_address", deliveryAddress)
                put("p_delivery_latitude", deliveryLat)
                put("p_delivery_longitude", deliveryLng)
                put("p_payment_method", paymentMethod)
                put("p_tip_amount", tipAmount)
                put("p_delivery_fee", deliveryFee)
                put("p_notes", notes)
                put("p_scheduled_for", JsonNull)
                put("p_distance_km", distanceKm)
                put("p_promo_code", promoCode)
            },
        )
        val raw = runCatching { response.decodeAs<String>() }.getOrElse {
            runCatching { response.decodeList<String>().first() }.getOrElse {
                // Last resort: strip quotes from body text if available
                error("place_order: unexpected response (expected UUID string)")
            }
        }
        val orderId = raw.trim().trim('"')
        if (orderId.isBlank()) error("place_order returned empty id")
        return orderId'''
          if old not in t:
              # try already-fixed
              if 'decodeAs<String>()' in t and 'place_order' in t:
                  print('repo already fixed')
              else:
                  raise SystemExit('placeOrder block not found')
          else:
              t = t.replace(old, new, 1)
              repo.write_text(t, encoding='utf-8')
              print('CustomerRepository placeOrder fixed')

          shell = Path('native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt')
          st = shell.read_text(encoding='utf-8')
          # Cash button was disabled when selected (enabled = paymentMethod != cash),
          # so both cash+card looked grey and unusable.
          bad_cash = '''                        Button(
                            onClick = { onSetPayment("cash") },
                            enabled = state.paymentMethod != "cash",
                            colors = ButtonDefaults.buttonColors(
                                containerColor = if (state.paymentMethod == "cash") FreshGreen else FreshChip,
                                contentColor = if (state.paymentMethod == "cash") Color.White else FreshInk,
                            ),
                            shape = RoundedCornerShape(16.dp),
                            modifier = Modifier.weight(1f),
                        ) {
                            Icon(Icons.Outlined.Wallet, contentDescription = null)
                            Spacer(Modifier.width(6.dp))
                            Text("Μετρητά")
                        }'''
          good_cash = '''                        Button(
                            onClick = { onSetPayment("cash") },
                            enabled = true,
                            colors = ButtonDefaults.buttonColors(
                                containerColor = if (state.paymentMethod == "cash") FreshGreen else FreshChip,
                                contentColor = if (state.paymentMethod == "cash") Color.White else FreshInk,
                                disabledContainerColor = if (state.paymentMethod == "cash") FreshGreen else FreshChip,
                                disabledContentColor = if (state.paymentMethod == "cash") Color.White else FreshMuted,
                            ),
                            shape = RoundedCornerShape(16.dp),
                            modifier = Modifier.weight(1f),
                        ) {
                            Icon(Icons.Outlined.Wallet, contentDescription = null)
                            Spacer(Modifier.width(6.dp))
                            Text("Μετρητά")
                        }'''
          if bad_cash in st:
              st = st.replace(bad_cash, good_cash, 1)
              shell.write_text(st, encoding='utf-8')
              print('cash button fixed')
          elif 'onSetPayment("cash")' in st and 'enabled = true' in st:
              print('cash already ok')
          else:
              print('WARNING: cash block pattern not exact — manual check')

          # ensure decodeAs import path works — kotlinx via postgrest
          # decodeAs is extension on PostgrestResult in supabase-kt
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no changes; else git commit -m "fix(native-customer): decode place_order UUID + enable cash button"; git push; fi
