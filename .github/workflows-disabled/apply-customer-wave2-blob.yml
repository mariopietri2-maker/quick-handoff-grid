name: Apply customer wave2 blob
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/wave2_blob.b64"
      - "scripts/apply_wave2_blob.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_wave2_blob.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          if git diff --staged --quiet; then echo no changes; else
            git commit -m "polish(native-customer): wave2 full UX (skeletons, haptic, address, track, hide games)"
            git push
          fi
