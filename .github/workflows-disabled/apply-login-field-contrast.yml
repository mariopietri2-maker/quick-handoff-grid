name: Apply login field contrast
on:
  push:
    paths:
      - 'scripts/apply_login_field_contrast.py'
      - '.github/workflows/apply-login-field-contrast.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_login_field_contrast.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-driver/ native-customer/
          git commit -m "fix(native): high-contrast login text fields (driver + customer)" || exit 0
          git push
