name: Build Store PWA Beta APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.store.config.ts"
      - ".github/workflows/build-store-beta-apk.yml"
      - "src/components/store/**"
      - "src/pages/Store*.tsx"

jobs:
  build-store-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install deps
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Minimal dist for Capacitor webDir
        run: |
          mkdir -p dist
          cat > dist/index.html << 'HTML'
          <!DOCTYPE html>
          <html><head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Fresh Store</title>
            <script>location.replace('https://quick-handoff-grid-production.up.railway.app/store');</script>
          </head>
          <body style="font-family:system-ui;padding:24px;background:#0FB876;color:#fff">
            <p>Άνοιγμα Store PWA…</p>
          </body></html>
          HTML

      - name: Use store Capacitor config
        run: |
          cp capacitor.store.config.ts capacitor.config.ts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools" || \
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Add Capacitor Android project (store)
        run: |
          rm -rf android-store
          npx cap add android
          # Ensure config path is android-store
          test -d android-store || mv android android-store
          npx cap sync android

      - name: Patch applicationId + version
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re
          for p in Path('android-store').rglob('build.gradle*'):
              t = p.read_text(encoding='utf-8')
              t2 = t
              t2 = re.sub(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.freshdelivery.store"', t2)
              t2 = re.sub(r'namespace\s+["\'][^"\']+["\']', 'namespace "com.freshdelivery.store"', t2)
              t2 = re.sub(r'versionCode\s+\d+', 'versionCode 100', t2)
              t2 = re.sub(r'versionName\s+["\'][^"\']+["\']', 'versionName "1.0.0-store-beta"', t2)
              if t2 != t:
                  p.write_text(t2, encoding='utf-8')
                  print('patched', p)
          # Cleartext not needed; allow Railway host in network security if present
          for p in Path('android-store').rglob('AndroidManifest.xml'):
              t = p.read_text(encoding='utf-8')
              if 'android.permission.INTERNET' not in t:
                  t = t.replace('<manifest', '<manifest xmlns:android="http://schemas.android.com/apk/res/android"')
              p.write_text(t, encoding='utf-8')
          PY

      - name: Assemble debug APK
        working-directory: android-store
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew || true
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist-apk
          APK=$(find android-store -name '*-debug.apk' -o -name 'app-debug.apk' | head -1)
          echo "Found $APK"
          cp -f "$APK" dist-apk/fresh-store-pwa-beta-debug.apk
          ls -lah dist-apk/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-pwa-beta-apk
          path: dist-apk/*.apk
          retention-days: 30

      - name: Publish to mobile-apks-v1 release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload mobile-apks-v1 dist-apk/fresh-store-pwa-beta-debug.apk --clobber || \
            gh release create mobile-apks-v1 dist-apk/fresh-store-pwa-beta-debug.apk \
              --title "Mobile APKs" --notes "Customer, Driver, Store PWA beta"
