                    fontSize = 16.sp,
                )
            }
        }
        Spacer(Modifier.height(10.dp))''',
              )

          shell.write_text(s)
          print('CustomerShell base UI patched')

          # ═══════════════════════════════════════════
          # 5) Driver HomeScreen — earnings + cash banners
          # ═══════════════════════════════════════════
          home = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/home/HomeScreen.kt')
