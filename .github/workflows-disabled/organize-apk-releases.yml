name: Organize APK Releases

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  organize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Move old assets to archive, keep latest native only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')

          if ! gh release view mobile-apks-archive >/dev/null 2>&1; then
            gh release create mobile-apks-archive \
              --title "Archive — older Android builds" \
              --notes "Older APK/AAB builds. Latest installs: mobile-apks-v1." \
              --prerelease
          fi

          gh api "repos/${REPO}/releases/tags/mobile-apks-v1" \
            --jq '.assets[] | [.id,.name,.browser_download_url] | @tsv' > /tmp/assets.tsv || true

          TMP=$(mktemp -d)
          while IFS=$'\t' read -r id name url; do
            [ -z "${id:-}" ] && continue
            case "$name" in
              fresh2go-driver-native-debug.apk|fresh2go-driver-native-debug.aab|fresh2go-customer-native-debug.apk|fresh2go-customer-native-debug.aab)
                echo "KEEP $name"
                ;;
              *)
                echo "ARCHIVE $name"
                if curl -fsSL -o "$TMP/$name" "$url"; then
                  gh release upload mobile-apks-archive "$TMP/$name" --clobber || true
                fi
                gh api -X DELETE "repos/${REPO}/releases/assets/$id" || true
                rm -f "$TMP/$name"
                ;;
            esac
          done < /tmp/assets.tsv
          rm -rf "$TMP"

          TITLE="Latest — Driver ${DRIVER_NAME} · Customer ${CUST_NAME}"
          NOTES="## Fresh2GO — latest Android builds only

Only current **native** APKs/AABs. Older files: https://github.com/${REPO}/releases/tag/mobile-apks-archive

### Install

| App | Version | Download |
|-----|---------|----------|
| Driver | ${DRIVER_NAME} (${DRIVER_CODE}) | [APK](https://github.com/${REPO}/releases/download/mobile-apks-v1/fresh2go-driver-native-debug.apk) |
| Customer | ${CUST_NAME} (${CUST_CODE}) | [APK](https://github.com/${REPO}/releases/download/mobile-apks-v1/fresh2go-customer-native-debug.apk) |

### Other
- Play Store AABs: https://github.com/${REPO}/releases/tag/play-store-aabs-v1
- Archive: https://github.com/${REPO}/releases/tag/mobile-apks-archive
"
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"

          if gh release view play-store-aabs-v1 >/dev/null 2>&1; then
            gh release edit play-store-aabs-v1 \
              --title "Play Store AABs (signed)" \
              --notes "Signed AABs for Google Play only. Sideload: mobile-apks-v1." || true
          fi

          echo "Remaining:"
          gh release view mobile-apks-v1 --json assets --jq '.assets[].name'
