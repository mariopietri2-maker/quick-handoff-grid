name: Apply driver map store visibility
on:
  push:
    paths:
      - 'scripts/apply_driver_map_store_visibility.py'
      - '.github/workflows/apply-driver-map-store-visibility.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_driver_map_store_visibility.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-driver/ src/lib/apk-downloads.ts
          git commit -m "feat(driver-map): larger store pins + clear order count badges (2.6.16)" || exit 0
          git push
