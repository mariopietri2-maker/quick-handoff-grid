name: Apply N-store deliveries on main
on:
  push:
    paths:
      - 'scripts/apply_n_store_deliveries_main.py'
      - '.github/workflows/apply-n-store-deliveries-main.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_n_store_deliveries_main.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/StoreApp.tsx
          git commit -m "feat(store-N): deliveries box under call panel" || exit 0
          git push
