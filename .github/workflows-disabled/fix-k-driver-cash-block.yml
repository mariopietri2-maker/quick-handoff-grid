name: Fix K driver cash block
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ViewModel
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt')
          t = p.read_text()
          old = '''                val isK = driver?.call_role == "K"\n                val offers: List<OfferUi>\n                val stacked: List<OfferUi>\n                val blocked = dState.on_break == true ||\n                    (dState.shift_cash_balance ?: 0.0) >= (settings.max_cash_cap ?: 200.0)\n'''
          new = '''                val isK = driver?.call_role == "K"\n                val offers: List<OfferUi>\n                val stacked: List<OfferUi>\n                // K-role drivers must not be blocked by cash cap — they only take N-store calls\n                val cashCappedNow = (dState.shift_cash_balance ?: 0.0) >= (settings.max_cash_cap ?: 200.0)\n                val blocked = dState.on_break == true || (!isK && cashCappedNow)\n'''
          if old not in t:
              if '(!isK && cashCappedNow)' in t:
                  print('already fixed')
              else:
                  raise SystemExit('pattern missing')
          else:
              p.write_text(t.replace(old, new, 1))
              print('patched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(driver): K-role not blocked by cash cap for N-store calls" || true
          git push
