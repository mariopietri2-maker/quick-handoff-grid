name: Apply Fresh2GO brand colors
on:
  push:
    paths:
      - 'scripts/apply_fresh2go_brand_web.py'
      - 'scripts/apply_fresh2go_brand_colors.py'
      - '.github/workflows/apply-fresh2go-brand.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_fresh2go_brand_web.py
      - run: python3 scripts/apply_fresh2go_brand_colors.py || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Index.tsx src/hooks/useCustomerAppConfig.ts src/components/brand/brand.ts native-driver/
          git commit -m "brand: Fresh2GO orange homepage + native driver login" || exit 0
          git push
