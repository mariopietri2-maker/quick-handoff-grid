name: Polish customer native wave2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/polish_customer_wave2.py"
      - ".github/workflows/polish-customer-wave2.yml"
jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/polish_customer_wave2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          if git diff --staged --quiet; then echo no changes; else
            git commit -m "polish(native-customer): wave2 — skeletons, sticky cart, haptic, address first, track empty, hide games"
            git push
          fi
