name: Signed customer Play AAB
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/signed-customer-aab.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore Play upload keystore
        run: |
          set -euo pipefail
          mkdir -p mobile-signing
          if [ -z "${PLAY_CUSTOMER_KEYSTORE_B64:-}" ]; then
            echo "ERROR: PLAY_CUSTOMER_KEYSTORE_B64 secret is missing"
            echo "Cannot produce Play-signed AAB without upload keystore."
            exit 1
          fi
          if [ -z "${PLAY_STORE_PASSWORD:-}" ]; then
            echo "ERROR: PLAY_STORE_PASSWORD secret is missing"
            exit 1
          fi
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          ls -la mobile-signing/fresh2go-customer-upload.jks
          ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          KEYPASS="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          # key.properties format expected by build.gradle.kts
          cat > mobile-signing/key.properties <<EOF
          storePassword=${PLAY_STORE_PASSWORD}
          keyPassword=${KEYPASS}
          keyAlias=${ALIAS}
          storeFile=fresh2go-customer-upload.jks
          customerStoreFile=fresh2go-customer-upload.jks
          EOF
          # Also export env vars build.gradle checks first
          echo "PLAY_KEYSTORE_FILE=${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks" >> "$GITHUB_ENV"
          echo "PLAY_KEY_ALIAS=${ALIAS}" >> "$GITHUB_ENV"
          echo "PLAY_STORE_PASSWORD=${PLAY_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "PLAY_KEY_PASSWORD=${KEYPASS}" >> "$GITHUB_ENV"
          echo "keystore restored alias=$ALIAS"

      - name: Mapbox + wrapper
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-customer/
          chmod +x native-customer/gradlew
          echo "sdk.dir=$ANDROID_HOME" > native-customer/local.properties

      - name: Bump versionCode if needed
        run: |
          # Keep 7233300 / 1.0.13 unless lower
          grep versionCode native-customer/app/build.gradle.kts | head -2

      - name: Bundle release (Play-signed)
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
          PLAY_KEY_ALIAS: ${{ env.PLAY_KEY_ALIAS }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PLAY_KEY_ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          export PLAY_KEY_PASSWORD="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Verify signing
        run: |
          set -euo pipefail
          AAB=$(find native-customer/app/build/outputs/bundle -name '*.aab' | head -1)
          echo "AAB=$AAB"
          ls -lh "$AAB"
          # jarsigner -verify works on AAB as zip; also try apksigner if present
          if command -v jarsigner >/dev/null; then
            jarsigner -verify -verbose -certs "$AAB" 2>&1 | tail -30 || true
          fi
          cp "$AAB" /tmp/fresh2go-customer-native-signed.aab
          cp "$AAB" /tmp/fresh2go-customer-native.aab
          cp "$AAB" /tmp/fresh2go-customer-native-v1.0.13-vc7233300-signed.aab

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=mobile-apks-v1
          for name in fresh2go-customer-native-signed.aab fresh2go-customer-native.aab fresh2go-customer-native-v1.0.13-vc7233300-signed.aab; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" 2>/dev/null || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" \
            /tmp/fresh2go-customer-native-signed.aab \
            /tmp/fresh2go-customer-native.aab \
            /tmp/fresh2go-customer-native-v1.0.13-vc7233300-signed.aab \
            --clobber
          echo SIGNED_AAB_UPLOADED
