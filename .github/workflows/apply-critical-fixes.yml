name: Apply critical fixes
on:
  push:
    paths:
      - "scripts/fix_patches/**"
      - ".github/workflows/apply-critical-fixes.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Apply patches
        run: |
          set -euo pipefail
          for f in scripts/fix_patches/*.py; do
            [ -f "$f" ] || continue
            echo "RUN $f"
            python3 "$f" || true
          done
          git config user.email "ci@fresh2go.gr"
          git config user.name "fresh2go-ci"
          git add -A
          git status
          git commit -m "release: live 2.9.15 customer (support reopen + splash + home)" || exit 0
          git push origin HEAD:main
