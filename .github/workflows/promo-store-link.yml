name: Promo store link
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/promo-store-link.py"
      - ".github/workflows/promo-store-link.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/promo-store-link.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: promo store_id link in admin + native open store" || true
          git push || true
