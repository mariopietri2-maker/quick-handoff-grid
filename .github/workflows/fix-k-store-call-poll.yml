name: Fix K store call poll
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ViewModel for K store calls
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt')
          t = p.read_text()
          old = '''                    storeCalls = storeCalls,\n                    activeStoreCall = activeStoreCall,\n                    error = null,\n                )\n                if (!isK) maybeAlertOffers(offers + stacked)\n'''
          new = '''                    storeCalls = storeCalls,\n                    activeStoreCall = activeStoreCall,\n                    error = null,\n                )\n                if (!isK) maybeAlertOffers(offers + stacked)\n                if (isK && storeCalls.isNotEmpty()) {\n                    val key = storeCalls.joinToString(",") { it.id }\n                    if (key != lastOfferAlertKey) {\n                        lastOfferAlertKey = key\n                        val local = _state.value.settingsLocal\n                        if (local.offerSound) playSoundById(local.soundId)\n                        if (local.vibration) vibrateOffer()\n                    }\n                }\n'''
          if 'isK && storeCalls.isNotEmpty()' in t:
              print('alert already present')
          elif old not in t:
              raise SystemExit('state update pattern missing')
          else:
              t = t.replace(old, new, 1)
              print('alert patched')

          old2 = '''        pollJob = viewModelScope.launch {\n            var tick = 0\n            while (true) {\n                delay(4_000)\n'''
          new2 = '''        pollJob = viewModelScope.launch {\n            var tick = 0\n            while (true) {\n                val isKPoll = _state.value.driverProfile?.call_role == "K"\n                delay(if (isKPoll) 2_000 else 4_000)\n'''
          if 'isKPoll' in t:
              print('poll already patched')
          elif old2 not in t:
              raise SystemExit('poll pattern missing')
          else:
              t = t.replace(old2, new2, 1)
              print('poll patched')

          p.write_text(t)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(driver): faster K store-call poll + sound alert" || true
          git push
