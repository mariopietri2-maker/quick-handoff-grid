name: Rebuild all native APKs (resilient)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rebuild-all-native-apks-resilient.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inline fix GOOGLE field + cart + versions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path("native-customer/app/build.gradle.kts")
          t = p.read_text()
          lines = t.splitlines(True)
          out = []
          i = 0
          while i < len(lines):
              if "Web client ID for Google" in lines[i]:
                  while i < len(lines) and "SUPABASE_URL" not in lines[i]:
                      i += 1
                  continue
              if "GOOGLE_WEB_CLIENT_ID" in lines[i] and "buildConfigField" in lines[i]:
                  while i < len(lines) and "SUPABASE_URL" not in lines[i]:
                      i += 1
                  continue
              if '""" + (project.findProperty' in lines[i]:
                  i += 1
                  continue
              out.append(lines[i])
              i += 1
          t = "".join(out)
          if "GOOGLE_WEB_CLIENT_ID" not in t:
              insert = (
                  "\n\n        val googleWebClientId = (project.findProperty(\"GOOGLE_WEB_CLIENT_ID\") as String?)\n"
                  "            ?: System.getenv(\"GOOGLE_WEB_CLIENT_ID\")\n"
                  "            ?: \"\"\n"
                  "        buildConfigField(\"String\", \"GOOGLE_WEB_CLIENT_ID\", \"\\\"$googleWebClientId\\\"\")\n"
              )
              t = re.sub(r'(versionName\s*=\s*"[^"]+")', r"\1" + insert, t, count=1)
          t = re.sub(r"versionCode\s*=\s*\d+", "versionCode = 7233212", t, count=1)
          t = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.10"', t, count=1)
          p.write_text(t)
          print("customer gradle fixed")

          p = Path("native-driver/app/build.gradle.kts")
          t = p.read_text()
          m = re.search(r"versionCode\s*=\s*(\d+)", t)
          if m:
              t = t.replace(m.group(0), f"versionCode = {int(m.group(1)) + 1}", 1)
          t = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.0.2"', t, count=1)
          p.write_text(t)
          print("driver bumped")

          p = Path("native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt")
          t = p.read_text()
          t = t.replace('"Προστέθηκε στο καλάθι"', "null", 1)
          t = t.replace(
              "fun scheduleBannerClear() {\n        viewModelScope.launch {\n            delay(4500)",
              "fun scheduleBannerClear(ms: Long = 4500) {\n        viewModelScope.launch {\n            delay(ms)",
              1,
          )
          p.write_text(t)
          print("vm cart fixed")

          p = Path("supabase/functions/create-viva-checkout/index.ts")
          if p.exists():
              p.write_text(p.read_text().replace("let sourceCode: string | null =", "const sourceCode: string | null ="))

          p = Path("src/lib/apk-downloads.ts")
          t = p.read_text()
          t = re.sub(r"APK_NATIVE_CUSTOMER_VERSION = '[^']+'", "APK_NATIVE_CUSTOMER_VERSION = '1.0.10'", t)
          t = re.sub(r"APK_NATIVE_DRIVER_VERSION = '[^']+'", "APK_NATIVE_DRIVER_VERSION = '1.0.2'", t)
          p.write_text(t)
          print("done")
          PY

      - name: Commit non-fatal
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix+chore: native 1.0.10/1.0.2 rebuild prep" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties

      - name: Wrappers
        run: |
          for app in native-customer native-driver native-admin; do
            [ -d "$app" ] || continue
            cp -R native-driver/gradle "$app/" 2>/dev/null || true
            cp native-driver/gradlew "$app/" 2>/dev/null || true
            chmod +x "$app/gradlew" 2>/dev/null || true
            echo "sdk.dir=$ANDROID_HOME" > "$app/local.properties"
          done

      - name: Build customer APK
        working-directory: native-customer
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build driver APK
        working-directory: native-driver
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build admin APK
        working-directory: native-admin
        continue-on-error: true
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace || true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-apks
          cp native-customer/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-customer-native-debug.apk
          cp native-driver/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-driver-native-debug.apk
          ls native-admin/app/build/outputs/apk/debug/*.apk 2>/dev/null && cp native-admin/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-admin-native-debug.apk || true
          ls -lah dist-apks/
          TAG=mobile-apks-v1
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Fresh2GO native APKs" --notes "debug"
          for name in fresh2go-customer-native-debug.apk fresh2go-driver-native-debug.apk fresh2go-admin-native-debug.apk; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" 2>/dev/null || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" dist-apks/*.apk --clobber
          echo OK
