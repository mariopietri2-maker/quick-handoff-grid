name: Disable roulette for now
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/disable-roulette-for-now.py"
      - ".github/workflows/disable-roulette.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/disable-roulette-for-now.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useCustomerAppConfig.ts src/pages/CustomerApp.tsx native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git commit -m "feat: disable roulette game for now (web + native)" || true
          git push || true
