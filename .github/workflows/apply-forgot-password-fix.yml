name: Apply forgot password fix
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-forgot-password-flow.py"
      - ".github/workflows/apply-forgot-password-fix.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-forgot-password-flow.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AuthPage.tsx native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/LoginScreen.kt
          git status
          git commit -m "fix(auth): forgot password requests code before OTP form" || echo nochange
          git push || true
