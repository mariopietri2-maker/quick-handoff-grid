name: Apply driver alert burst + ensure APK build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/apply-driver-alert-burst.yml"

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch DriverViewModel alert burst
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt")
          t = p.read_text(encoding="utf-8")
          if "alertRepeatJob" in t and "startAlertBurst" in t:
              print("Already patched")
              raise SystemExit(0)

          if "import android.media.AudioAttributes" not in t:
              t = t.replace(
                  "import android.media.AudioManager\n",
                  "import android.media.AudioAttributes\nimport android.media.AudioManager\n",
                  1,
              )

          if "private var alertRepeatJob" not in t:
              t = t.replace(
                  "private var lastOfferAlertKey: String? = null\n",
                  "private var lastOfferAlertKey: String? = null\n    private var alertRepeatJob: Job? = null\n",
                  1,
              )

          t = t.replace("if (!s.offerSound) stopOfferSound()", "if (!s.offerSound) stopAlertBurst()")

          old_sc = '''                if (isCallDriverRole && storeCalls.isNotEmpty()) {
                    val key = storeCalls.joinToString(",") { it.id }
                    if (key != lastOfferAlertKey) {
                        lastOfferAlertKey = key
                        val local = _state.value.settingsLocal
                        if (local.offerSound) playSoundById(local.soundId)
                        if (local.vibration) vibrateOffer()
                    }
                }'''
          new_sc = '''                if (isCallDriverRole && storeCalls.isNotEmpty()) {
                    startAlertBurst(
                        key = "sc:" + storeCalls.joinToString(",") { it.id },
                        reps = 8,
                        gapMs = 1100L,
                    )
                } else if (isCallDriverRole && lastOfferAlertKey?.startsWith("sc:") == true) {
                    lastOfferAlertKey = null
                    stopAlertBurst()
                }'''
          if old_sc not in t:
              raise SystemExit("store-call alert block not found")
          t = t.replace(old_sc, new_sc, 1)

          # stop sound on accept/decline/store accept
          t = t.replace("        stopOfferSound()\n        viewModelScope.launch {\n            runCatching {\n                if (offerId.isNotBlank()) repo.acceptOffer(offerId)",
                        "        stopAlertBurst()\n        viewModelScope.launch {\n            runCatching {\n                if (offerId.isNotBlank()) repo.acceptOffer(offerId)")
          t = t.replace("        stopOfferSound()\n        viewModelScope.launch {\n            runCatching { repo.declineOffer(offerId) }",
                        "        stopAlertBurst()\n        viewModelScope.launch {\n            runCatching { repo.declineOffer(offerId) }")
          if "stopAlertBurst()" not in t[t.find("fun acceptStoreCall"):t.find("fun completeActiveCall")]:
              t = t.replace(
                  "        _state.value = s.copy(\n            storeCalls = s.storeCalls.filterNot { it.id == callId },\n            busy = true,\n            error = null,\n        )\n        viewModelScope.launch {",
                  "        _state.value = s.copy(\n            storeCalls = s.storeCalls.filterNot { it.id == callId },\n            busy = true,\n            error = null,\n        )\n        stopAlertBurst()\n        viewModelScope.launch {",
                  1,
              )

          t = t.replace("        stopPresenceHeartbeat()\n        stopOfferSound()\n    }",
                        "        stopPresenceHeartbeat()\n        stopAlertBurst()\n    }")

          # Replace maybeAlertOffers + playSoundById + stopOfferSound with burst helpers
          start = t.find("    private fun maybeAlertOffers")
          end = t.find("    /** Play a short sequence of DTMF/system tones")
          if start < 0 or end < 0:
              raise SystemExit(f"markers missing start={start} end={end}")

          replacement = r'''    private fun maybeAlertOffers(offers: List<OfferUi>) {
        val key = offers.joinToString(",") { it.offerId.ifBlank { it.order.id } }
        if (key.isEmpty()) {
            if (lastOfferAlertKey?.startsWith("of:") == true) {
                lastOfferAlertKey = null
                stopAlertBurst()
            }
            return
        }
        startAlertBurst(key = "of:$key", reps = 6, gapMs = 900L)
    }

    private fun startAlertBurst(key: String, reps: Int = 6, gapMs: Long = 900L) {
        if (key == lastOfferAlertKey && alertRepeatJob?.isActive == true) return
        lastOfferAlertKey = key
        alertRepeatJob?.cancel()
        val local = _state.value.settingsLocal
        if (!local.offerSound && !local.vibration) return
        val soundId = local.soundId
        val doSound = local.offerSound
        val doVibrate = local.vibration
        alertRepeatJob = viewModelScope.launch {
            repeat(reps.coerceIn(1, 12)) { i ->
                if (doSound) playSoundOnce(soundId)
                if (doVibrate) vibrateOffer()
                if (i < reps - 1) delay(gapMs)
            }
        }
    }

    private fun stopAlertBurst() {
        alertRepeatJob?.cancel()
        alertRepeatJob = null
        stopMediaPlayer()
    }

    private fun playSoundOnce(soundId: String) {
        stopMediaPlayer()
        val app = getApplication<Application>()
        val notifAttrs = AudioAttributes.Builder()
            .setUsage(AudioAttributes.USAGE_NOTIFICATION_RINGTONE)
            .setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION)
            .build()
        fun startMp(mp: MediaPlayer?) {
            mp ?: return
            runCatching {
                mp.setAudioAttributes(notifAttrs)
                mp.isLooping = false
                mp.start()
                mediaPlayer = mp
            }.onFailure {
                runCatching { mp.release() }
            }
        }
        when (OfferSoundId.fromId(soundId)) {
            OfferSoundId.CLASSIC -> runCatching { startMp(MediaPlayer.create(app, R.raw.fresh_delivery)) }
            OfferSoundId.CHIME -> runCatching {
                val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_NOTIFICATION)
                startMp(MediaPlayer.create(app, uri))
            }
            OfferSoundId.ALERT -> runCatching {
                val uri = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                startMp(MediaPlayer.create(app, uri))
            }
            OfferSoundId.PING -> playToneSequence(
                listOf(
                    ToneGenerator.TONE_PROP_BEEP2 to 180,
                    ToneGenerator.TONE_PROP_ACK to 160,
                ),
                gapsMs = listOf(40),
            )
            OfferSoundId.BELL -> playToneSequence(
                listOf(
                    ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD to 280,
                    ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD to 280,
                ),
                gapsMs = listOf(120),
            )
            OfferSoundId.DOUBLE -> playToneSequence(
                listOf(
                    ToneGenerator.TONE_PROP_BEEP to 140,
                    ToneGenerator.TONE_PROP_BEEP to 140,
                    ToneGenerator.TONE_PROP_ACK to 200,
                ),
                gapsMs = listOf(80, 80),
            )
            OfferSoundId.URGENT -> playToneSequence(
                listOf(
                    ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK to 220,
                    ToneGenerator.TONE_CDMA_EMERGENCY_RINGBACK to 220,
                    ToneGenerator.TONE_CDMA_ALERT_CALL_GUARD to 300,
                ),
                gapsMs = listOf(60, 60),
                volume = 100,
            )
            OfferSoundId.SOFT -> playToneSequence(
                listOf(
                    ToneGenerator.TONE_PROP_PROMPT to 220,
                    ToneGenerator.TONE_PROP_ACK to 180,
                ),
                gapsMs = listOf(100),
                volume = 70,
            )
        }
    }

    /** Preview from settings — single play, no burst. */
    private fun playSoundById(soundId: String) {
        playSoundOnce(soundId)
    }

    private fun stopMediaPlayer() {
        runCatching {
            mediaPlayer?.stop()
            mediaPlayer?.release()
        }
        mediaPlayer = null
    }

'''
          t = t[:start] + replacement + t[end:]
          p.write_text(t, encoding="utf-8")
          print("Patched OK", p.stat().st_size)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt || true
          if git diff --staged --quiet; then
            echo "No ViewModel changes"
          else
            git commit -m "fix(native-driver): repeat alert burst for offers and store calls"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties

      - name: Build driver debug APK
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publish APK to mobile-apks-v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p dist
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/fresh-driver-native-debug.apk
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Delivery Android APKs + AABs" --notes "Native debug APKs"
          gh release upload mobile-apks-v1 dist/fresh-driver-native-debug.apk --clobber
          echo "Published:"
          ls -lah dist/
