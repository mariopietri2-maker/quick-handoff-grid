name: Wire store call notify UI
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wire-store-call-notify-ui.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch StoreCallPanel
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path('src/components/store/StoreCallPanel.tsx')
          t = p.read_text(encoding='utf-8')
          needle = '''      toast({
        title: 'Κλήση ενεργή',
        description: 'Οι οδηγοί K ειδοποιήθηκαν. Η κλήση μένει ανοιχτή έως 15 λεπτά.',
      });
      setTimeout(() => fetchCall(), 2000);'''
          insert = '''      toast({
        title: 'Κλήση ενεργή',
        description: 'Οι οδηγοί K ειδοποιήθηκαν. Η κλήση μένει ανοιχτή έως 15 λεπτά.',
      });
      // Immediate FCM drain so drivers ring without opening the app.
      void supabase.functions
        .invoke('store-call-notify', {
          body: {
            call_id: call.id,
            store_name: storeName,
          },
        })
        .catch((err) => console.warn('store-call-notify', err));
      setTimeout(() => fetchCall(), 2000);'''
          if 'store-call-notify' not in t and needle in t:
              t = t.replace(needle, insert)
              p.write_text(t, encoding='utf-8')
              print('StoreCallPanel wired')
          else:
              print('skip or already wired', 'notify' in t, needle[:40] in t)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no changes; else git commit -m "fix(store): invoke store-call-notify after call create"; git push; fi
