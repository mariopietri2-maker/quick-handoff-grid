name: Fix escpos getChunks
on:
  push:
    paths:
      - "scripts/fix-escpos-getchunks.py"
      - ".github/workflows/fix-escpos-chunks.yml"
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-escpos-getchunks.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/print-order-escpos.ts
          git commit -m "fix(print): getChunks return" || true
          git push || true
