name: Fix receipt readability
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-receipt-readability.py"
      - ".github/workflows/fix-receipt-readability.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-receipt-readability.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/PrintOrderTicket.tsx
          git commit -m "fix(print): readable centered ticket, no clipped euros" || true
          git push || true
