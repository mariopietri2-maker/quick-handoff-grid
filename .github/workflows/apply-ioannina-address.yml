name: Apply Ioannina address UX
on:
  push:
    paths:
      - '.github/workflows/apply-ioannina-address.yml'
      - 'scripts/apply_ioannina_address.py'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_ioannina_address.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer): friendlier Ioannina-focused address (2.7.1)" || exit 0
          git push
