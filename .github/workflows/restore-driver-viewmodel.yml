name: Restore DriverViewModel
on:
  push:
    paths:
      - ".github/workflows/restore-driver-viewmodel.yml"
  workflow_dispatch:
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
      - name: Restore ViewModel from pre-placeholder commit
        run: |
          set -euo pipefail
          git show 44a5ebcce5c6dbd1772ab10e9e790ecf91206bb7:native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt > native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt
          python3 <<'PY'
from pathlib import Path
p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt')
t = p.read_text()
assert 'class DriverViewModel' in t
old = '''            }.onFailure { e ->
                _state.value = _state.value.copy(
                    busy = false,
                    error = handleError("acceptStoreCall", e),
                    storeCalls = if (removed != null && _state.value.storeCalls.none { it.id == removed.id }) {
                        (_state.value.storeCalls + removed)
                    } else _state.value.storeCalls,
                )
                refreshWork()
            }'''
new = '''            }.onFailure { e ->
                val msg = friendlyError(e)
                viewModelScope.launch { runCatching { repo.logAppError("acceptStoreCall", e.message ?: msg) } }
                _state.value = _state.value.copy(
                    busy = false,
                    error = msg,
                    storeCalls = if (removed != null && _state.value.storeCalls.none { it.id == removed.id }) {
                        (_state.value.storeCalls + removed)
                    } else _state.value.storeCalls,
                )
                refreshWork()
            }'''
if old not in t:
    raise SystemExit('acceptStoreCall pattern not found')
t = t.replace(old, new, 1)
p.write_text(t)
print('patched ok', len(t))
PY
          git config user.email "ci@fresh2go.gr"
          git config user.name "fresh2go-ci"
          git add native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt
          git commit -m "restore(native-driver): DriverViewModel + show store-call accept errors"
          git push origin HEAD:main
