name: Wheel recommend stores after win
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/feat-wheel-recommend-stores.py"
      - ".github/workflows/feat-wheel-recommend-stores.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature
        run: python3 scripts/feat-wheel-recommend-stores.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          if git diff --staged --quiet; then echo no change; else
            git commit -m "feat(customer-native): after wheel win recommend stores + auto-apply promo"
            git push
          fi
