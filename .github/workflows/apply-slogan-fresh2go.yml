name: Apply fresh2go slogan
on:
  push:
    paths:
      - 'scripts/apply_slogan_fresh_meals.py'
      - '.github/workflows/apply-slogan-fresh2go.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - run: python3 scripts/apply_slogan_fresh_meals.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "brand: Fresh Food. Fast Delivery. (2.7.3 / 2.6.15)" || exit 0
          git push
