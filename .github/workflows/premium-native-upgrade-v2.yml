name: Premium Native Upgrade v2
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/premium-native-upgrade-v2.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire banner track + HomeTab params
        run: |
          python3 .github/scripts/premium-native-upgrade-v2.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver
          git diff --cached --quiet && echo No changes || (git commit -m "fix(native): wire active-order banner to track + keep driver compile green" && git push)
