name: Restore good sources and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore known-good Kotlin sources from git history
        run: |
          set -euo pipefail
          # MapView: last successful build with order-count badges (cb17400)
          git show cb17400b542bcd6c10beaed00cc6eb958bdb7ac1:native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/map/DriverMapView.kt \
            > native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/map/DriverMapView.kt
          # ViewModel: sounds + stronger vibrate (b0cec74)
          git show b0cec74a4d9af59956e314f11e54133b3956b3b7:native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt \
            > native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt
          # MoneyScreen: last compiling version before truncation (da4ee4a)
          git show da4ee4a09b09e6c66fc08db6b27ce9b8ab71fd00:native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/money/MoneyScreen.kt \
            > native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/money/MoneyScreen.kt

          # Sanity checks
          for f in \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/map/DriverMapView.kt \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/money/MoneyScreen.kt; do
            bytes=$(wc -c < "$f")
            echo "$f bytes=$bytes"
            test "$bytes" -gt 5000
            head -c 20 "$f" | grep -q package
          done

      - name: Bump versionCode for release
        run: |
          # versionCode 259 / 2.6.8-native
          sed -i 's/versionCode = [0-9]*/versionCode = 259/' native-driver/app/build.gradle.kts
          sed -i 's/versionName = "[^"]*"/versionName = "2.6.8-native"/' native-driver/app/build.gradle.kts
          grep -E 'versionCode|versionName' native-driver/app/build.gradle.kts

      - name: Commit restored sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/map/DriverMapView.kt \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt \
            native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/money/MoneyScreen.kt \
            native-driver/app/build.gradle.kts
          if git diff --staged --quiet; then
            echo "No source changes (already restored)"
          else
            git commit -m "fix(native-driver): restore MapView+ViewModel+MoneyScreen from good commits; bump 2.6.8-native/259"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build driver debug APK
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/fresh-driver-native-debug.apk
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/FreshDelivery-Driver-2.6.8-native-259.apk
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: driver-native-apk-2.6.8
          path: dist/*

      - name: Publish to mobile-apks-v1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Meal Android APKs + AABs" --notes "Native debug APKs"
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to https://github.com/mariopietri2-maker/quick-handoff-grid/releases/tag/mobile-apks-v1"
