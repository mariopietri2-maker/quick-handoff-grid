name: Apply Ioannina-only suggestions
on:
  push:
    paths:
      - 'scripts/apply_ioannina_only_suggestions.py'
      - '.github/workflows/apply-ioannina-only-suggestions.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_ioannina_only_suggestions.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "fix(customer-native): suggestions only inside Ioannina" || exit 0
          git push
