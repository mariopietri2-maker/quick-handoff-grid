name: Receipt euro symbol
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-receipt-euro-symbol.py"
      - ".github/workflows/fix-receipt-euro.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-receipt-euro-symbol.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/print-order-escpos.ts src/lib/escpos.ts
          git commit -m "fix(print): amounts use € instead of E" || true
          git push || true
