name: Label APK versions on release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update release notes + rename assets with version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "Driver $DRIVER_NAME ($DRIVER_CODE)  Customer $CUST_NAME ($CUST_CODE)"

          NOTES=$(cat <<EOF
          ## Fresh Delivery — latest Android builds

          | App | Version | Build | File |
          |-----|---------|-------|------|
          | **Driver** | **${DRIVER_NAME}** | ${DRIVER_CODE} | \`fresh-driver-native-debug.apk\` |
          | **Customer** | **${CUST_NAME}** | ${CUST_CODE} | \`fresh-customer-native-debug.apk\` |

          ### Downloads
          - Driver APK: [fresh-driver-native-debug.apk](https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-driver-native-debug.apk) — **v${DRIVER_NAME} (${DRIVER_CODE})**
          - Customer APK: [fresh-customer-native-debug.apk](https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-customer-native-debug.apk) — **v${CUST_NAME} (${CUST_CODE})**

          AABs (Play-style debug bundles) use the same versions.

          *Only the latest build is kept on this release.*
          EOF
          )

          # Title includes versions
          TITLE="Driver ${DRIVER_NAME} (${DRIVER_CODE}) · Customer ${CUST_NAME} (${CUST_CODE})"
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"

          # Also patch build workflow so future uploads refresh notes + versioned copies
          python3 << 'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-native-apks.yml')
          t = p.read_text()
          marker = 'Publish APK + AAB to mobile-apks-v1 GitHub release only'
          if 'Driver APK version on release' in t:
              print('build workflow already labels versions')
          else:
              old = '''      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == \'refs/heads/main\'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \\
            gh release create mobile-apks-v1 --title "Fresh Delivery Android APKs + AABs" --notes "Native debug APKs and debug AABs. GitHub release only (not website)."
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to GitHub release mobile-apks-v1:"
          ls dist/
'''
              new = '''      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == \'refs/heads/main\'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DRIVER_NAME=$(grep -E \'versionName\\s*=\' native-driver/app/build.gradle.kts | head -1 | sed -E \'s/.*"([^\"]+)".*/\\1/\')
          DRIVER_CODE=$(grep -E \'versionCode\\s*=\' native-driver/app/build.gradle.kts | head -1 | sed -E \'s/[^0-9]//g\')
          CUST_NAME=$(grep -E \'versionName\\s*=\' native-customer/app/build.gradle.kts | head -1 | sed -E \'s/.*"([^\"]+)".*/\\1/\')
          CUST_CODE=$(grep -E \'versionCode\\s*=\' native-customer/app/build.gradle.kts | head -1 | sed -E \'s/[^0-9]//g\')
          # Versioned copies next to stable names
          cp -f dist/fresh-driver-native-debug.apk "dist/fresh-driver-native-${DRIVER_NAME}-${DRIVER_CODE}.apk" 2>/dev/null || true
          cp -f dist/fresh-customer-native-debug.apk "dist/fresh-customer-native-${CUST_NAME}-${CUST_CODE}.apk" 2>/dev/null || true
          NOTES=$(cat <<EOF
          ## Fresh Delivery — latest Android builds

          | App | Version | Build | File |
          |-----|---------|-------|------|
          | **Driver** | **${DRIVER_NAME}** | ${DRIVER_CODE} | \`fresh-driver-native-debug.apk\` |
          | **Customer** | **${CUST_NAME}** | ${CUST_CODE} | \`fresh-customer-native-debug.apk\` |

          ### Downloads
          - Driver APK — **v${DRIVER_NAME} (${DRIVER_CODE})**: [fresh-driver-native-debug.apk](https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-driver-native-debug.apk)
          - Customer APK — **v${CUST_NAME} (${CUST_CODE})**: [fresh-customer-native-debug.apk](https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-customer-native-debug.apk)

          *Only the latest build is kept on this release.*
          EOF
          )
          TITLE="Driver ${DRIVER_NAME} (${DRIVER_CODE}) · Customer ${CUST_NAME} (${CUST_CODE})"
          gh release view mobile-apks-v1 >/dev/null 2>&1 || gh release create mobile-apks-v1 --title "$TITLE" --notes "$NOTES"
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"
          # Drop any older versioned apk names before upload
          gh api repos/${{ github.repository }}/releases/tags/mobile-apks-v1 --jq \'.assets[] | select(.name | test("FreshDelivery|2\\.6\\.|debug\\.apk$")) | .id\' | while read -r id; do
            [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to GitHub release mobile-apks-v1:"
          ls dist/
'''
              if old not in t:
                  print('WARN: publish step pattern missing; notes still updated via gh release edit')
              else:
                  p.write_text(t.replace(old, new, 1))
                  print('build workflow patched')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: label APK versions on release publish" || true
          git push || true
