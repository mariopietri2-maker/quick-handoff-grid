name: Apply menu category chips
on:
  push:
    paths:
      - 'scripts/apply_menu_category_chips.py'
      - '.github/workflows/apply-menu-category-chips.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_menu_category_chips.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): menu category chips + unavailable + min header" || exit 0
          git push
