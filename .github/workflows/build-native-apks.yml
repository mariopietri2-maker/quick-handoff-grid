name: Build Native APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/**"
      - "native-customer/**"
      - "mobile-signing/fresh2go-debug.keystore"
      - "src/lib/apk-downloads.ts"
      - ".github/workflows/build-native-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set — Mapbox SDK resolve may fail"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify shared debug keystore + version parity
        run: |
          test -f mobile-signing/fresh2go-debug.keystore || { echo "::error::missing mobile-signing/fresh2go-debug.keystore"; exit 1; }
          keytool -list -keystore mobile-signing/fresh2go-debug.keystore -storepass android -alias androiddebugkey >/dev/null
          python3 - <<'PY'
          import re, sys
          apk = open('src/lib/apk-downloads.ts').read()
          web_driver = re.search(r"APK_NATIVE_DRIVER_VERSION\s*=\s*'([^']+)'", apk).group(1)
          web_customer = re.search(r"APK_NATIVE_CUSTOMER_VERSION\s*=\s*'([^']+)'", apk).group(1)
          gradle_driver = re.search(r'versionName\s*=\s*"([^"]+)"', open('native-driver/app/build.gradle.kts').read()).group(1)
          gradle_customer = re.search(r'versionName\s*=\s*"([^"]+)"', open('native-customer/app/build.gradle.kts').read()).group(1)
          print(f"web driver={web_driver} gradle driver={gradle_driver}")
          print(f"web customer={web_customer} gradle customer={gradle_customer}")
          if web_driver != gradle_driver or web_customer != gradle_customer:
              print("::error::versionName mismatch")
              sys.exit(1)
          PY

      - name: Build driver debug APK + debug AAB
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Prepare customer gradle wrapper
        run: |
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-driver/gradlew.bat native-customer/
          chmod +x native-customer/gradlew

      - name: Build customer debug APK + debug AAB
        id: customer
        working-directory: native-customer
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Stage APKs and AABs
        run: |
          mkdir -p dist
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-driver-native-debug.apk
          if [ -f native-driver/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-driver/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-driver-native-debug.aab
          fi
          if [ ! -f native-customer/app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "::error::customer APK missing - compile failed"
            exit 1
          fi
          cp native-customer/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-customer-native-debug.apk
          if [ -f native-customer/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-customer/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-customer-native-debug.aab
          fi
          ls -lah dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-apks-aabs
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Meal Android APKs + AABs" --notes "Native debug APKs and debug AABs."
          gh release upload mobile-apks-v1 dist/* --clobber
          ls dist/

      - name: Organize release assets (latest only + archive)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')

          if ! gh release view mobile-apks-archive >/dev/null 2>&1; then
            gh release create mobile-apks-archive \
              --title "Archive - older Android builds" \
              --notes "Older APK/AAB builds. Latest installs: mobile-apks-v1." \
              --prerelease
          fi

          gh api "repos/${REPO}/releases/tags/mobile-apks-v1" \
            --jq '.assets[] | [.id,.name,.browser_download_url] | @tsv' > /tmp/assets.tsv || true

          TMP=$(mktemp -d)
          while IFS=$'\t' read -r id name url; do
            [ -z "${id:-}" ] && continue
            case "$name" in
              fresh2go-driver-native-debug.apk|fresh2go-driver-native-debug.aab|fresh2go-customer-native-debug.apk|fresh2go-customer-native-debug.aab)
                echo "KEEP $name"
                ;;
              *)
                echo "ARCHIVE $name"
                if curl -fsSL -o "$TMP/$name" "$url"; then
                  gh release upload mobile-apks-archive "$TMP/$name" --clobber || true
                fi
                gh api -X DELETE "repos/${REPO}/releases/assets/$id" || true
                rm -f "$TMP/$name"
                ;;
            esac
          done < /tmp/assets.tsv
          rm -rf "$TMP"

          TITLE="Latest - Driver ${DRIVER_NAME} - Customer ${CUST_NAME}"
          NOTES=$(printf '%s\n' \
            "## Fresh2GO - latest Android builds only" \
            "" \
            "Only current native APKs/AABs. Older files: https://github.com/${REPO}/releases/tag/mobile-apks-archive" \
            "" \
            "### Install" \
            "" \
            "- Driver ${DRIVER_NAME} (${DRIVER_CODE}): https://github.com/${REPO}/releases/download/mobile-apks-v1/fresh2go-driver-native-debug.apk" \
            "- Customer ${CUST_NAME} (${CUST_CODE}): https://github.com/${REPO}/releases/download/mobile-apks-v1/fresh2go-customer-native-debug.apk" \
            "" \
            "### Other" \
            "- Play Store AABs: https://github.com/${REPO}/releases/tag/play-store-aabs-v1" \
            "- Archive: https://github.com/${REPO}/releases/tag/mobile-apks-archive")
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"
          echo "Remaining:"
          gh release view mobile-apks-v1 --json assets --jq '.assets[].name'
