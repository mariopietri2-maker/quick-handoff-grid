# Rebuild after HomeScreen restore + next-wave compile fix
name: Build Native APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/**"
      - "native-customer/**"
      - ".github/workflows/build-native-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set — Mapbox SDK resolve may fail"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build driver debug APK + debug AAB
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Prepare customer gradle wrapper
        run: |
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-driver/gradlew.bat native-customer/
          chmod +x native-customer/gradlew

      - name: Build customer debug APK + debug AAB
        id: customer
        continue-on-error: true
        working-directory: native-customer
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Stage APKs and AABs
        run: |
          mkdir -p dist
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-driver-native-debug.apk
          if [ -f native-driver/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-driver/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-driver-native-debug.aab
          fi
          if [ -f native-customer/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp native-customer/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-customer-native-debug.apk
          fi
          if [ -f native-customer/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-customer/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-customer-native-debug.aab
          fi
          ls -lah dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-apks-aabs
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "fresh2go Android APKs + AABs" --notes "Native debug APKs and debug AABs. GitHub release only (not website)."
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to GitHub release mobile-apks-v1:"
          ls dist/

      - name: Update release name and notes with current versions
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/mobile-apks-v1
        run: |
          set -euo pipefail
          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          BUILD_TS=$(date -u '+%Y-%m-%d %H:%M UTC')
          SHORT_SHA="${GITHUB_SHA:0:7}"
          TITLE="Driver ${DRIVER_NAME} (${DRIVER_CODE}) · Customer ${CUST_NAME} (${CUST_CODE})"
          BASE="$RELEASE_BASE"
          NOTES="## fresh2go — latest Android builds
          **Built:** ${BUILD_TS} from commit ${SHORT_SHA}

          | App | Version | Build | Download |
          |-----|---------|-------|----------|
          | **Driver** | **${DRIVER_NAME}** | ${DRIVER_CODE} | [fresh2go-driver-native-debug.apk](${BASE}/fresh2go-driver-native-debug.apk) |
          | **Customer** | **${CUST_NAME}** | ${CUST_CODE} | [fresh2go-customer-native-debug.apk](${BASE}/fresh2go-customer-native-debug.apk) |

          ### Driver APK — v${DRIVER_NAME} (build ${DRIVER_CODE})
          ${BASE}/fresh2go-driver-native-debug.apk

          ### Customer APK — v${CUST_NAME} (build ${CUST_CODE})
          ${BASE}/fresh2go-customer-native-debug.apk

          ### Version notes
          - Driver ${DRIVER_NAME} (build ${DRIVER_CODE}) — rebuilt ${BUILD_TS}
          - Customer ${CUST_NAME} (build ${CUST_CODE}) — rebuilt ${BUILD_TS}
          - Native debug AABs are attached alongside the APKs for sideload/testing.

          Only the latest build is kept on this release."
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"
          echo "Updated release to: $TITLE"
