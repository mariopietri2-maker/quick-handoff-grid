# Rebuild after HomeScreen restore + next-wave compile fix
name: Build Native APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/**"
      - "native-customer/**"
      - "mobile-signing/fresh2go-debug.keystore"
      - "src/lib/apk-downloads.ts"
      - ".github/workflows/build-native-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full CustomerShell + Games and apply alive motion
        run: |
          set -e
          git config user.email "fresh2go-bot@users.noreply.github.com"
          git config user.name "fresh2go-bot"
          GOOD=549cdf5dc7793abb27f3fcb1f5e4497fd851bc58
          git show $GOOD:native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt \
            > native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git show $GOOD:native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/Games.kt \
            > native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/Games.kt
          python3 - <<'PY'
          from pathlib import Path
          path = Path("native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt")
          text = path.read_text()
          if "animateFloatAsState" not in text:
              text = text.replace(
                  "import androidx.compose.animation.core.animateFloat\n",
                  "import androidx.compose.animation.core.animateFloat\nimport androidx.compose.animation.core.animateFloatAsState\n",
              )
          if "MutableInteractionSource" not in text:
              text = text.replace(
                  "import androidx.compose.foundation.clickable\n",
                  "import androidx.compose.foundation.clickable\nimport androidx.compose.foundation.interaction.MutableInteractionSource\nimport androidx.compose.foundation.interaction.collectIsPressedAsState\n",
              )
          old_badge = """                    Box(contentAlignment = Alignment.TopEnd) {
                        IconButton(onClick = onOpenCart) {
                            Icon(Icons.Outlined.ShoppingBag, contentDescription = "Καλάθι", tint = FreshInk)
                        }
                        if (state.cartCount > 0) {
                            Surface(
                                color = Color(0xFFEA580C),
                                shape = CircleShape,
                                modifier = Modifier.padding(top = 6.dp, end = 6.dp),
                            ) {
                                Text(
                                    text = if (state.cartCount > 9) "9+" else "${state.cartCount}",
                                    color = Color.White,
                                    fontWeight = FontWeight.Bold,
                                    fontSize = 10.sp,
                                    modifier = Modifier.padding(horizontal = 5.dp, vertical = 1.dp),
                                )
                            }
                        }
                    }"""
          new_badge = """                    Box(contentAlignment = Alignment.TopEnd) {
                        IconButton(onClick = onOpenCart) {
                            Icon(Icons.Outlined.ShoppingBag, contentDescription = "Καλάθι", tint = FreshInk)
                        }
                        if (state.cartCount > 0) {
                            val cartPulse = rememberInfiniteTransition(label = "cartPulse")
                            val cartScale by cartPulse.animateFloat(
                                initialValue = 1f,
                                targetValue = 1.18f,
                                animationSpec = infiniteRepeatable(
                                    animation = tween(700, easing = FastOutSlowInEasing),
                                    repeatMode = RepeatMode.Reverse,
                                ),
                                label = "cartScale",
                            )
                            Surface(
                                color = Color(0xFFEA580C),
                                shape = CircleShape,
                                modifier = Modifier
                                    .padding(top = 6.dp, end = 6.dp)
                                    .graphicsLayer {
                                        scaleX = cartScale
                                        scaleY = cartScale
                                    },
                            ) {
                                Text(
                                    text = if (state.cartCount > 9) "9+" else "${state.cartCount}",
                                    color = Color.White,
                                    fontWeight = FontWeight.Bold,
                                    fontSize = 10.sp,
                                    modifier = Modifier.padding(horizontal = 5.dp, vertical = 1.dp),
                                )
                            }
                        }
                    }"""
          if old_badge not in text:
              raise SystemExit("cart badge block missing")
          text = text.replace(old_badge, new_badge)
          old_card = """@Composable
private fun FreshStoreCard(
    store: StoreRow,
    onClick: () -> Unit,
    rating: StoreRating? = null,
    isFavorite: Boolean = false,
    deliveryLat: Double? = null,
    deliveryLng: Double? = null,
    onToggleFavorite: (() -> Unit)? = null,
) {
    val openNow = isStoreOpenNow(store)
    val active = store.is_active != false
    Column(
        Modifier
            .fillMaxWidth()
            .padding(horizontal = 16.dp, vertical = 8.dp)
            .shadow(6.dp, RoundedCornerShape(22.dp))
            .clip(RoundedCornerShape(22.dp))
            .background(Color.White)
            .clickable(onClick = onClick),
    ) {"""
          new_card = """@Composable
private fun FreshStoreCard(
    store: StoreRow,
    onClick: () -> Unit,
    rating: StoreRating? = null,
    isFavorite: Boolean = false,
    deliveryLat: Double? = null,
    deliveryLng: Double? = null,
    onToggleFavorite: (() -> Unit)? = null,
) {
    val openNow = isStoreOpenNow(store)
    val active = store.is_active != false
    val interaction = remember { MutableInteractionSource() }
    val pressed by interaction.collectIsPressedAsState()
    val pressScale by animateFloatAsState(
        targetValue = if (pressed) 0.97f else 1f,
        animationSpec = tween(120, easing = FastOutSlowInEasing),
        label = "storePress",
    )
    val openPulse = rememberInfiniteTransition(label = "openPulse")
    val openDotScale by openPulse.animateFloat(
        initialValue = 1f,
        targetValue = 1.55f,
        animationSpec = infiniteRepeatable(
            animation = tween(900, easing = FastOutSlowInEasing),
            repeatMode = RepeatMode.Reverse,
        ),
        label = "openDot",
    )
    Column(
        Modifier
            .fillMaxWidth()
            .padding(horizontal = 16.dp, vertical = 8.dp)
            .graphicsLayer {
                scaleX = pressScale
                scaleY = pressScale
            }
            .shadow(6.dp, RoundedCornerShape(22.dp))
            .clip(RoundedCornerShape(22.dp))
            .background(Color.White)
            .clickable(interactionSource = interaction, indication = null, onClick = onClick),
    ) {"""
          if old_card not in text:
              raise SystemExit("store card missing")
          text = text.replace(old_card, new_card)
          old_dot = """                    if (active && openNow) {
                        Box(
                            Modifier
                                .size(6.dp)
                                .clip(CircleShape)
                                .background(Color.White),
                        )
                        Spacer(Modifier.width(5.dp))
                    }"""
          new_dot = """                    if (active && openNow) {
                        Box(
                            Modifier
                                .size(6.dp)
                                .graphicsLayer {
                                    scaleX = openDotScale
                                    scaleY = openDotScale
                                    alpha = 0.55f + (openDotScale - 1f) * 0.6f
                                }
                                .clip(CircleShape)
                                .background(Color.White),
                        )
                        Spacer(Modifier.width(5.dp))
                    }"""
          if old_dot not in text:
              raise SystemExit("open dot missing")
          text = text.replace(old_dot, new_dot)
          path.write_text(text)
          print("patched", path, "lines", len(text.splitlines()))
          PY
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt \
                  native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/Games.kt
          if ! git diff --cached --quiet; then
            git commit -m "ui(native-customer): restore full home UI + alive motion"
            git push origin HEAD || true
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set — Mapbox SDK resolve may fail"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Verify shared debug keystore + version parity
        run: |
          test -f mobile-signing/fresh2go-debug.keystore || { echo "::error::missing mobile-signing/fresh2go-debug.keystore — all debug APKs must share one signature for self-update"; exit 1; }
          keytool -list -keystore mobile-signing/fresh2go-debug.keystore -storepass android -alias androiddebugkey >/dev/null || { echo "::error::debug keystore alias/password mismatch"; exit 1; }
          python3 - <<'PY'
          import re, sys
          apk = open('src/lib/apk-downloads.ts').read()
          web_driver = re.search(r"APK_NATIVE_DRIVER_VERSION\s*=\s*'([^']+)'", apk).group(1)
          web_customer = re.search(r"APK_NATIVE_CUSTOMER_VERSION\s*=\s*'([^']+)'", apk).group(1)
          gradle_driver = re.search(r'versionName\s*=\s*"([^"]+)"', open('native-driver/app/build.gradle.kts').read()).group(1)
          gradle_customer = re.search(r'versionName\s*=\s*"([^"]+)"', open('native-customer/app/build.gradle.kts').read()).group(1)
          print(f"web driver={web_driver} gradle driver={gradle_driver}")
          print(f"web customer={web_customer} gradle customer={gradle_customer}")
          if web_driver != gradle_driver or web_customer != gradle_customer:
              print("::error::versionName mismatch: bump native build.gradle.kts AND src/lib/apk-downloads.ts together, or self-update will misfire")
              sys.exit(1)
          PY

      - name: Build driver debug APK + debug AAB
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Prepare customer gradle wrapper
        run: |
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-driver/gradlew.bat native-customer/
          chmod +x native-customer/gradlew

      - name: Build customer debug APK + debug AAB
        id: customer
        continue-on-error: true
        working-directory: native-customer
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Stage APKs and AABs
        run: |
          mkdir -p dist
          cp native-driver/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-driver-native-debug.apk
          if [ -f native-driver/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-driver/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-driver-native-debug.aab
          fi
          if [ -f native-customer/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp native-customer/app/build/outputs/apk/debug/app-debug.apk dist/fresh2go-customer-native-debug.apk
          fi
          if [ -f native-customer/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-customer/app/build/outputs/bundle/debug/app-debug.aab dist/fresh2go-customer-native-debug.aab
          fi
          ls -lah dist/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-apks-aabs
          path: |
            dist/*.apk
            dist/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Meal Android APKs + AABs" --notes "Native debug APKs and debug AABs. GitHub release only (not website)."
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to GitHub release mobile-apks-v1:"
          ls dist/
