# Rebuild after HomeScreen restore + next-wave compile fix
name: Build Native APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/**"
      - "native-customer/**"
      - ".github/workflows/build-native-apks.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set — Mapbox SDK resolve may fail"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build driver debug APK + debug AAB
        working-directory: native-driver
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Prepare customer gradle wrapper
        run: |
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-driver/gradlew.bat native-customer/
          chmod +x native-customer/gradlew

      - name: Build customer debug APK + debug AAB
        id: customer
        continue-on-error: true
        working-directory: native-customer
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace

      - name: Stage APKs and AABs (versioned filenames)
        id: stage
        run: |
          mkdir -p dist
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          BRANCH="${GITHUB_REF_NAME}"
          # Read versionCode / versionName from each app
          D_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | grep -oE '[0-9]+' | head -1)
          D_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          C_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | grep -oE '[0-9]+' | head -1)
          C_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          D_CODE=${D_CODE:-0}
          C_CODE=${C_CODE:-0}
          D_NAME=${D_NAME:-unknown}
          C_NAME=${C_NAME:-unknown}

          DRIVER_APK="fresh-driver-v${D_CODE}-${D_NAME}-${SHORT_SHA}.apk"
          CUSTOMER_APK="fresh-customer-v${C_CODE}-${C_NAME}-${SHORT_SHA}.apk"

          cp native-driver/app/build/outputs/apk/debug/app-debug.apk "dist/${DRIVER_APK}"
          # Stable alias for scripts
          cp "dist/${DRIVER_APK}" dist/fresh-driver-native-debug.apk

          if [ -f native-driver/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-driver/app/build/outputs/bundle/debug/app-debug.aab "dist/fresh-driver-v${D_CODE}-${SHORT_SHA}.aab"
          fi
          if [ -f native-customer/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp native-customer/app/build/outputs/apk/debug/app-debug.apk "dist/${CUSTOMER_APK}"
            cp "dist/${CUSTOMER_APK}" dist/fresh-customer-native-debug.apk
          fi
          if [ -f native-customer/app/build/outputs/bundle/debug/app-debug.aab ]; then
            cp native-customer/app/build/outputs/bundle/debug/app-debug.aab "dist/fresh-customer-v${C_CODE}-${SHORT_SHA}.aab"
          fi

          # Human-readable build card — open this BEFORE installing
          cat > dist/BUILD_INFO.txt << EOF
========================================
  Fresh Delivery — Native APK build card
========================================
Built at (UTC):  $(date -u +%Y-%m-%dT%H:%M:%SZ)
GitHub branch:   ${BRANCH}
Git commit:      ${GITHUB_SHA}
Short SHA:       ${SHORT_SHA}
Workflow run:    ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

DRIVER
  versionName:   ${D_NAME}
  versionCode:   ${D_CODE}
  file:          ${DRIVER_APK}

CUSTOMER
  versionName:   ${C_NAME}
  versionCode:   ${C_CODE}
  file:          ${CUSTOMER_APK}

How to know you have the NEW app:
  Android Settings → Apps → Fresh Driver → version should show ${D_NAME} (${D_CODE})

NOTE: GitHub release "mobile-apks-v1" only updates from main.
      Branch builds are Actions Artifacts only.
========================================
EOF
          cat dist/BUILD_INFO.txt
          ls -lah dist/
          echo "artifact_name=native-apks-v${D_CODE}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.artifact_name }}
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK + AAB to mobile-apks-v1 GitHub release only
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view mobile-apks-v1 >/dev/null 2>&1 || \
            gh release create mobile-apks-v1 --title "Fresh Delivery Android APKs + AABs" --notes "Native debug APKs and debug AABs. GitHub release only (not website)."
          gh release upload mobile-apks-v1 dist/* --clobber
          echo "Published to GitHub release mobile-apks-v1:"
          ls dist/
