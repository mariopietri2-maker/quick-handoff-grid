name: Cash once on receipt
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-receipt-cash-once.py"
      - ".github/workflows/fix-receipt-cash-once.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-receipt-cash-once.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/PrintOrderTicket.tsx src/lib/print-order-escpos.ts
          git commit -m "fix(print): ΜΕΤΡΗΤΑ ΕΙΣΠΡΑΞΗ only once" || true
          git push || true
