name: Apply store menu + ETA fix
on:
  push:
    paths:
      - 'scripts/apply_store_menu_eta_fix.py'
      - '.github/workflows/apply-store-menu-eta-fix.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_store_menu_eta_fix.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/ supabase/migrations/
          git commit -m "fix(customer): load real menus; seed empty stores; stabilize ETA" || exit 0
          git push
