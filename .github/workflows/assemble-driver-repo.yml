name: Assemble DriverRepository
on:
  workflow_dispatch:
  push:
    paths:
      - "native-driver/_restore_parts/**"
      - ".github/workflows/assemble-driver-repo.yml"
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concat parts
        run: |
          set -euo pipefail
          TARGET=native-driver/app/src/main/java/com/freshdelivery/nativedriver/data/DriverRepository.kt
          mkdir -p "$(dirname "$TARGET")"
          cat native-driver/_restore_parts/part0.txt \
              native-driver/_restore_parts/part1.txt \
              native-driver/_restore_parts/part2.txt \
              native-driver/_restore_parts/part3.txt > "$TARGET"
          wc -c "$TARGET"
          grep -q register_driver_push_token "$TARGET"
          python3 -c "import re; from pathlib import Path; g=Path('native-driver/app/build.gradle.kts'); t=g.read_text(); t=re.sub(r'versionCode = \\d+','versionCode = 277',t); t=re.sub(r'versionName = \"[^\"]+\"','versionName = \"2.6.23-fcm-token\"',t); g.write_text(t)"
          echo '2.6.23-fcm-token' > native-driver/APK_VERSION.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no changes; else git commit -m "fix(native-driver): restore full DriverRepository 2.6.23-fcm-token"; git push; fi
