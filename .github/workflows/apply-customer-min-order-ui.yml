name: Apply customer min order UI
on:
  push:
    paths:
      - 'scripts/apply_customer_min_order_ui.py'
      - '.github/workflows/apply-customer-min-order-ui.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_customer_min_order_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): show Ελάχ. amount on store cards" || exit 0
          git push
