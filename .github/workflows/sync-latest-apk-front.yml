name: Sync latest APK to release + website
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Native APKs"]
    types: [completed]
permissions:
  contents: write
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put latest natives first + bump website versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DRIVER_V=$(grep -oP 'versionName = "\K[^"]+' native-driver/app/build.gradle.kts | head -1)
          DRIVER_C=$(grep -oP 'versionCode = \K[0-9]+' native-driver/app/build.gradle.kts | head -1)
          CUST_V=$(grep -oP 'versionName = "\K[^"]+' native-customer/app/build.gradle.kts | head -1)
          CUST_C=$(grep -oP 'versionCode = \K[0-9]+' native-customer/app/build.gradle.kts | head -1)
          echo "Driver $DRIVER_V ($DRIVER_C) · Customer $CUST_V ($CUST_C)"

          python3 << PY
          from pathlib import Path

          driver_v = """$DRIVER_V""".strip()
          cust_v = """$CUST_V""".strip()

          p = Path("src/lib/apk-downloads.ts")
          t = p.read_text()
          import re
          t = re.sub(r"export const APK_NATIVE_DRIVER_VERSION = '[^']+';", f"export const APK_NATIVE_DRIVER_VERSION = '{driver_v}'", t)
          t = re.sub(r"export const APK_NATIVE_CUSTOMER_VERSION = '[^']+';", f"export const APK_NATIVE_CUSTOMER_VERSION = '{cust_v}'", t)
          p.write_text(t)
          print("apk-downloads.ts versions updated")

          page = Path("src/pages/DownloadAppPage.tsx")
          pt = page.read_text()
          old = '''        <div className="grid sm:grid-cols-2 gap-5 sm:gap-6">
          <ApkCard flavor="customer" highlighted={focus === 'customer'} />
          <ApkCard flavor="customerNative" highlighted={focus === 'customerNative'} />
          <ApkCard flavor="driver" highlighted={focus === 'driver'} />
          <ApkCard flavor="driverNative" highlighted={focus === 'driverNative'} />
        </div>'''
          new = '''        <div className="grid sm:grid-cols-2 gap-5 sm:gap-6">
          <ApkCard flavor="driverNative" highlighted={focus === 'driverNative'} />
          <ApkCard flavor="customerNative" highlighted={focus === 'customerNative'} />
          <ApkCard flavor="driver" highlighted={focus === 'driver'} />
          <ApkCard flavor="customer" highlighted={focus === 'customer'} />
        </div>'''
          if new in pt:
              print("DownloadAppPage already latest-first")
          elif old in pt:
              page.write_text(pt.replace(old, new, 1))
              print("DownloadAppPage reordered latest-first")
          else:
              print("WARN: DownloadAppPage pattern missing")

          # Version line: put native driver first
          pt = page.read_text()
          pt2 = re.sub(
              r"Capacitor v\{APK_BUILD_VERSION\} · Native customer v\{APK_NATIVE_CUSTOMER_VERSION\} · Native driver v\{APK_NATIVE_DRIVER_VERSION\}",
              "Native driver v{APK_NATIVE_DRIVER_VERSION} · Native customer v{APK_NATIVE_CUSTOMER_VERSION} · Capacitor v{APK_BUILD_VERSION}",
              pt,
          )
          if pt2 != pt:
              page.write_text(pt2)
              print("header version order updated")
          PY

          BODY=$(cat <<EOF
          ## Fresh Delivery latest Android builds

          **Latest first**

          1. **Driver APK** — **${DRIVER_V}** (build ${DRIVER_C})
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-driver-native-debug.apk

          2. **Customer APK** — **${CUST_V}** (build ${CUST_C})
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-customer-native-debug.apk

          Only the latest build is kept on this release.
          EOF
          )
          gh release edit mobile-apks-v1 \
            --repo "${{ github.repository }}" \
            --title "Driver ${DRIVER_V} (${DRIVER_C}) · Customer ${CUST_V} (${CUST_C})" \
            --notes "$BODY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/apk-downloads.ts src/pages/DownloadAppPage.tsx
          if git diff --staged --quiet; then
            echo "No website file changes"
          else
            git commit -m "chore(web): latest native APKs first (${DRIVER_V} / ${CUST_V})"
            git push
          fi
