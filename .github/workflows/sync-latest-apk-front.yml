name: Sync latest APK to release + website
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Native APKs"]
    types: [completed]
permissions:
  contents: write
jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump website versions + refresh release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DRIVER_V=$(grep -oP 'versionName = "\K[^"]+' native-driver/app/build.gradle.kts | head -1)
          DRIVER_C=$(grep -oP 'versionCode = \K[0-9]+' native-driver/app/build.gradle.kts | head -1)
          CUST_V=$(grep -oP 'versionName = "\K[^"]+' native-customer/app/build.gradle.kts | head -1)
          CUST_C=$(grep -oP 'versionCode = \K[0-9]+' native-customer/app/build.gradle.kts | head -1)
          echo "Driver $DRIVER_V ($DRIVER_C) · Customer $CUST_V ($CUST_C)"

          export DRIVER_V CUST_V
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          driver_v = os.environ["DRIVER_V"].strip()
          cust_v = os.environ["CUST_V"].strip()

          p = Path("src/lib/apk-downloads.ts")
          t = p.read_text(encoding="utf-8")
          t2 = re.sub(
              r"export const APK_NATIVE_DRIVER_VERSION = '[^']*';",
              f"export const APK_NATIVE_DRIVER_VERSION = '{driver_v}';",
              t,
          )
          t2 = re.sub(
              r"export const APK_NATIVE_CUSTOMER_VERSION = '[^']*';",
              f"export const APK_NATIVE_CUSTOMER_VERSION = '{cust_v}';",
              t2,
          )
          marker = f"export const APK_NATIVE_DRIVER_VERSION = '{driver_v}';"
          if marker not in t2:
              raise SystemExit("ERROR: APK_NATIVE_DRIVER_VERSION pattern drifted — update regex")
          if t2 != t:
              p.write_text(t2, encoding="utf-8")
              print("apk-downloads.ts versions updated")
          else:
              print("apk-downloads.ts already up to date")
          PY

          BODY=$(cat <<EOF
          ## Fresh Meal latest Android builds

          **Latest first**

          1. **Driver APK** — **${DRIVER_V}** (build ${DRIVER_C})
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-driver-native-debug.apk

          2. **Customer APK** — **${CUST_V}** (build ${CUST_C})
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh-customer-native-debug.apk

          Only the latest build is kept on this release.
          EOF
          )
          gh release edit mobile-apks-v1 \
            --repo "${{ github.repository }}" \
            --title "Driver ${DRIVER_V} (${DRIVER_C}) · Customer ${CUST_V} (${CUST_C})" \
            --notes "$BODY"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/apk-downloads.ts src/pages/DownloadAppPage.tsx
          if git diff --staged --quiet; then
            echo "No website file changes"
          else
            git commit -m "chore(web): latest native APK versions (${DRIVER_V} / ${CUST_V})"
            git push
          fi
