name: Fix store alert 5 rings
on:
  push:
    paths:
      - "scripts/fix-store-alert-5-and-mute.py"
      - ".github/workflows/fix-store-alert-5.yml"
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-store-alert-5-and-mute.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useOrders.ts
          git commit -m "fix(store): 5 rings auto-accept + respect mute LS" || true
          git push || true
