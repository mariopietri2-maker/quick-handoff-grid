name: Apply Native Capacitor Parity

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and write parity files
        run: |
          python3 <<'PY'
          import gzip, base64, json
          from pathlib import Path
          payload = json.loads(Path('native-customer/_parity_payload.json').read_text())
          for path, b64 in payload.items():
              data = gzip.decompress(base64.b64decode(b64))
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(data)
              print('wrote', path, len(data))
              assert len(data) > 100, path
              assert b'package ' in data[:80] or b'import ' in data[:200], path
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(native-customer): Capacitor parity phase 1 — Browse, admin config, promos, active order"
          git push
