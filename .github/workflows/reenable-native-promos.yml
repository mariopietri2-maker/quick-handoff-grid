name: Re-enable native promo cards
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/reenable-native-promos.py"
      - ".github/workflows/reenable-native-promos.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/reenable-native-promos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git commit -m "fix(native): show admin promo cards on home again" || true
          git push || true
