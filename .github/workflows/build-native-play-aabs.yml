# Build SIGNED Play Store AABs for the NATIVE (Kotlin + Compose) apps.
# The GitHub release play-store-aabs-v1 contains Capacitor (WebView) AABs -
# this workflow produces the true native builds, signed with the same Play
# upload keystores already enrolled in Google Play App Signing.
#
# REQUIRED repo secrets (Settings > Secrets and variables > Actions):
#   PLAY_CUSTOMER_KEYSTORE_B64  base64 of mobile-signing/fresh2go-customer-upload.jks
#   PLAY_DRIVER_KEYSTORE_B64    base64 of mobile-signing/fresh2go-driver-upload.jks
#   PLAY_STORE_PASSWORD         storePassword from mobile-signing/key.properties
#   PLAY_KEY_PASSWORD           keyPassword from mobile-signing/key.properties
#   MAPBOX_DOWNLOADS_TOKEN      (driver Mapbox Maps SDK Maven token)
#
# Aliases used: fresh2go-customer / fresh2go-driver (same as build-release-aabs.yml).

name: Build Native Play Store AABs

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode - MUST be higher than the last version in Play Console (currently 7232800)."
        required: false
        default: "7233000"
      version_name:
        description: "Android versionName (default: 1.0.<version_code>)."
        required: false
        default: ""

concurrency:
  group: native-play-aabs
  cancel-in-progress: false

jobs:
  build-native-aabs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox downloads token
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set - driver build may fail resolving Mapbox Maps SDK"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties

      - name: Restore Play upload keystores
        env:
          PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
          PLAY_DRIVER_KEYSTORE_B64: ${{ secrets.PLAY_DRIVER_KEYSTORE_B64 }}
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in PLAY_CUSTOMER_KEYSTORE_B64 PLAY_DRIVER_KEYSTORE_B64 PLAY_STORE_PASSWORD PLAY_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret ${v} - add it in Settings > Secrets and variables > Actions"
              exit 1
            fi
          done
          mkdir -p mobile-signing
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          echo "$PLAY_DRIVER_KEYSTORE_B64"   | base64 -d > mobile-signing/fresh2go-driver-upload.jks
          keytool -list -keystore mobile-signing/fresh2go-customer-upload.jks -storepass "$PLAY_STORE_PASSWORD" | grep -E "fresh2go-customer"
          ls -l mobile-signing/*.jks

      - name: Set versionCode / versionName in native apps
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          VERSION_NAME_INPUT: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          CODE="${VERSION_CODE_INPUT:-$(date -u +%-m%d%H%M)}"
          CODE_INT=$((10#$CODE + 0))
          MIN=7233000
          if [ "$CODE_INT" -lt "$MIN" ]; then
            echo "::error::versionCode $CODE_INT is below Play's current 7232800 - use $MIN or higher"
            exit 1
          fi
          NAME="${VERSION_NAME_INPUT:-1.0.${CODE}}"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          python3 - native-driver/app/build.gradle.kts native-customer/app/build.gradle.kts "$CODE" "$NAME" <<'PY'
import re, sys
path1, path2, code, name = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
for path in (path1, path2):
    text = open(path).read()
    text = re.sub(r"versionCode\s+\d+", f"versionCode {code}", text, count=1)
    text = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{name}"', text, count=1)
    open(path, "w").write(text)
    print(f"bumped -> {path}: versionCode={code} versionName={name}")
PY

      - name: Build driver native release AAB
        working-directory: native-driver
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-driver-upload.jks
          PLAY_KEY_ALIAS: fresh2go-driver
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Prepare customer gradle wrapper
        run: |
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-driver/gradlew.bat native-customer/
          chmod +x native-customer/gradlew

      - name: Build customer native release AAB
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
          PLAY_KEY_ALIAS: fresh2go-customer
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Stage native AABs
        run: |
          set -euo pipefail
          mkdir -p store-bundles
          cp native-driver/app/build/outputs/bundle/release/app-release.aab store-bundles/fresh2go-driver-native-release.aab
          cp native-customer/app/build/outputs/bundle/release/app-release.aab store-bundles/fresh2go-customer-native-release.aab
          ls -lah store-bundles/

      - name: Verify signatures
        env:
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for aab in store-bundles/*.aab; do
            echo "==> $aab"
            "$JAVA_HOME/bin/jarsigner" -verify -certs "$aab" | head -n 5
          done
          sha256sum store-bundles/*.aab

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-play-aabs
          path: store-bundles/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish to native-play-aabs-v1 GitHub release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view native-play-aabs-v1 >/dev/null 2>&1 || \
            gh release create native-play-aabs-v1 --title "Fresh2GO Native Play Store AABs (signed)" --notes "Native Kotlin + Compose AABs signed with the Play upload keystores. Upload each in Play Console > Internal testing or Production."
          gh release upload native-play-aabs-v1 store-bundles/*.aab --clobber
          echo "Published to GitHub release native-play-aabs-v1:"
          ls -lah store-bundles/
          echo "versionCode=$VERSION_CODE versionName=$VERSION_NAME"