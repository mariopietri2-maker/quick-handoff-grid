name: Apply index hero brand
on:
  push:
    paths:
      - 'scripts/apply_index_hero_brand.py'
      - '.github/workflows/apply-index-hero-brand.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_index_hero_brand.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Index.tsx src/hooks/useCustomerAppConfig.ts
          git commit -m "brand: homepage hero matches Fresh2GO orange + slogan" || exit 0
          git push
