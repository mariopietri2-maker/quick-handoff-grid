name: Next Wave UI Wire
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/next-wave-ui-wire.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire UI + MainActivity
        run: |
          python3 .github/scripts/next-wave-ui-wire.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver
          if git diff --cached --quiet; then echo No changes; else
            git commit -m "feat(native): wire next-wave UI callbacks — favorites, filters, promo, wallet, order-again"
            git push
          fi
