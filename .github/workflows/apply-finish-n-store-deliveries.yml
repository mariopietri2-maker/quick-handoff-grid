name: Apply finish N-store deliveries box
on:
  push:
    paths:
      - 'scripts/apply_finish_n_store_deliveries_box.py'
      - '.github/workflows/apply-finish-n-store-deliveries.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_finish_n_store_deliveries_box.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/StoreDriverIdPanel.tsx src/pages/StoreApp.tsx supabase/migrations/
          git commit -m "feat(store-N): deliveries box shows in-progress + completed for owner" || exit 0
          git push
