name: Production signed AAB 1.0.63
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-signed-aab-1-0-63.yml"
      - "scripts/patch_remove_km_limit_1_0_63.py"
concurrency:
  group: native-play-aabs-1063
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Remove km limit + session patches
        run: |
          python3 scripts/patch_remove_km_limit_1_0_63.py
          python3 scripts/patch_session_persist_1_0_62.py 2>/dev/null || true
      - name: Version 1.0.63 / 7238300
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          VER, CODE = "1.0.63", "7238300"
          p = Path("native-customer/app/build.gradle.kts")
          t = p.read_text()
          t = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {CODE}", t)
          t = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{VER}"', t)
          p.write_text(t)
          print(VER, CODE)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer src/pages/CheckoutPage.tsx || true
          git commit -m "fix: remove 7km delivery limit (1.0.63)" || true
          git push || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle mobile-signing
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          cat > mobile-signing/key.properties <<EOF
          storePassword=${PLAY_STORE_PASSWORD}
          keyPassword=${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}
          keyAlias=fresh2go-customer
          storeFile=fresh2go-customer-upload.jks
          customerStoreFile=fresh2go-customer-upload.jks
          EOF
      - name: Bundle
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
          PLAY_KEY_ALIAS: fresh2go-customer
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp -R ../native-driver/gradle .
          cp ../native-driver/gradlew ../native-driver/gradlew.bat .
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AAB=native-customer/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          cp "$AAB" /tmp/fresh2go-customer-native-signed.aab
          cp "$AAB" /tmp/fresh2go-customer-native-v1.0.63-vc7238300-signed.aab
          gh release view mobile-apks-v1 >/dev/null 2>&1 || gh release create mobile-apks-v1 --title mobile-apks-v1 --notes native
          gh release upload mobile-apks-v1 /tmp/fresh2go-customer-native-signed.aab /tmp/fresh2go-customer-native-v1.0.63-vc7238300-signed.aab --clobber
          echo AAB_1_0_63_OK
