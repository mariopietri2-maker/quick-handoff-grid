# Customer Capacitor debug APK — committed android/ + live https://fresh2go.gr/order
name: Build Capacitor APKs

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/build-apks.sh"
      - "package.json"
      - "capacitor.config.ts"
      - "capacitor.customer.config.ts"
      - ".github/workflows/build-capacitor-apks.yml"
      - "android/**"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install platform android-35
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Install deps
        run: npm ci

      - name: Build customer Capacitor APK
        run: bash scripts/build-apks.sh customer
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: customer-capacitor-apk
          path: |
            **/*.apk
          if-no-files-found: warn
