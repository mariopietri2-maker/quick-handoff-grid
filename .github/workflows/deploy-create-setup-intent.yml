name: Deploy create-setup-intent
on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/create-setup-intent/**"
      - "supabase/functions/_shared/stripe.ts"
      - ".github/workflows/deploy-create-setup-intent.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ojkesspghyqmjmupybva
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add GitHub secret SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access Tokens)"
            exit 1
          fi
          supabase functions deploy create-setup-intent --project-ref "$PROJECT_REF" --no-verify-jwt=false
          echo "Deployed create-setup-intent"
