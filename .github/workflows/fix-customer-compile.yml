name: Fix Customer Compile Once

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore CustomerShell without duplicate LoginScreen
        run: |
          set -euo pipefail
          SRC=native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git show a6da17b9bea7d0eedf2d78e7b0da5584dea41752:"$SRC" > "$SRC"
          # Delete from "@Composable / fun LoginScreen" through the blank line before "@Composable / fun CustomerShell"
          awk '
            /^@Composable$/ { buf=$0; getline; if ($0 ~ /^fun LoginScreen\(/) { skip=1; next } else { if (skip) skip=0; print buf; print; next } }
            skip && /^@Composable$/ { buf=$0; getline; if ($0 ~ /^fun CustomerShell\(/) { skip=0; print buf; print; next } else next }
            skip { next }
            { print }
          ' "$SRC" > /tmp/shell_fixed.kt
          mv /tmp/shell_fixed.kt "$SRC"
          if grep -n "fun LoginScreen" "$SRC"; then echo "LoginScreen still present" >&2; exit 1; fi
          grep -n "fun CustomerShell" "$SRC"

      - name: Fix selectTab exhaustive Browse
        run: |
          set -euo pipefail
          SRC=native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt
          git show a6da17b9bea7d0eedf2d78e7b0da5584dea41752:"$SRC" > "$SRC"
          sed -i 's/CustomerTab.Home -> refreshStores()/CustomerTab.Home, CustomerTab.Browse -> refreshStores()/' "$SRC"
          grep -n "CustomerTab.Home, CustomerTab.Browse" "$SRC"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt \
                  native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(native-customer): remove duplicate LoginScreen + exhaustive selectTab(Browse)"
          git push origin HEAD:main
