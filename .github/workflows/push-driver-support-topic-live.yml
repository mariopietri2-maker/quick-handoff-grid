name: Push driver support topic live
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply all support topic changes
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path

          # --- Models: topic field ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/data/Models.kt')
          t = p.read_text()
          if 'val topic: String? = null' not in t or 'data class LiveChatMessageRow' not in t:
              pass
          old = '''data class LiveChatMessageRow(\n    val id: String,\n    val driver_id: String? = null,\n    val sender_id: String? = null,\n    val sender_role: String? = null,\n    val message: String? = null,\n    val created_at: String? = null,\n)\n'''
          new = '''data class LiveChatMessageRow(\n    val id: String,\n    val driver_id: String? = null,\n    val sender_id: String? = null,\n    val sender_role: String? = null,\n    val message: String? = null,\n    val topic: String? = null,\n    val created_at: String? = null,\n)\n'''
          if old in t:
              p.write_text(t.replace(old, new, 1))
              print('Models: topic field added')
          else:
              print('Models: already patched or pattern miss')

          # --- DriverRepository ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/data/DriverRepository.kt')
          t = p.read_text()
          if 'ensureDriverLiveChatSession' not in t:
              old = '''    suspend fun sendLiveChatMessage(driverId: String, senderId: String, message: String) {\n        client.from("live_chat_messages").insert(\n            buildJsonObject {\n                put("driver_id", driverId)\n                put("sender_id", senderId)\n                put("sender_role", "driver")\n                put("message", message)\n            },\n        )\n    }\n'''
              new = '''    suspend fun ensureDriverLiveChatSession(topic: String): String {\n        return client.postgrest.rpc(\n            "ensure_driver_live_chat_session",\n            buildJsonObject { put("p_topic", topic) },\n        ).decodeAs<String>()\n    }\n\n    suspend fun sendLiveChatMessage(\n        driverId: String,\n        senderId: String,\n        message: String,\n        topic: String? = null,\n    ) {\n        client.from("live_chat_messages").insert(\n            buildJsonObject {\n                put("driver_id", driverId)\n                put("sender_id", senderId)\n                put("sender_role", "driver")\n                put("message", message)\n                if (!topic.isNullOrBlank()) put("topic", topic)\n            },\n        )\n    }\n'''
              assert old in t, 'DriverRepository pattern missing'
              p.write_text(t.replace(old, new, 1))
              print('DriverRepository patched')
          else:
              print('DriverRepository already')

          # --- ViewModel ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverViewModel.kt')
          t = p.read_text()
          if 'ensureDriverLiveChatSession' not in t:
              old = '''    /** Opens live chat from the headphone flow, seeding the first message. */\n    fun startLiveChat(initialMessage: String?) {\n        openLiveChat()\n        val msg = initialMessage?.trim()\n        if (!msg.isNullOrBlank()) sendLiveChatMessage(msg)\n    }\n'''
              new = '''    /** Start live chat with required topic. Only SUPPORT can close (server-side). */\n    fun startLiveChat(topic: String, initialMessage: String? = null) {\n        val uid = _state.value.userId ?: return\n        val topicTrim = topic.trim()\n        if (topicTrim.isEmpty()) {\n            _state.value = _state.value.copy(liveChatError = "Pick a topic")\n            return\n        }\n        viewModelScope.launch {\n            _state.value = _state.value.copy(liveChatLoading = true, liveChatError = null, liveChatOpen = true)\n            runCatching {\n                repo.ensureDriverLiveChatSession(topicTrim)\n                val body = initialMessage?.trim().orEmpty().ifBlank { "Topic: $topicTrim" }\n                repo.sendLiveChatMessage(uid, uid, body, topic = topicTrim)\n                repo.fetchLiveChat(uid)\n            }.onSuccess { msgs ->\n                _state.value = _state.value.copy(liveChatMessages = msgs, liveChatLoading = false, supportOpen = true)\n                startLiveChatSubscription(uid)\n            }.onFailure { e ->\n                _state.value = _state.value.copy(liveChatLoading = false, liveChatError = handleError("startLiveChat", e))\n            }\n        }\n    }\n'''
              assert old in t, 'ViewModel startLiveChat missing'
              t = t.replace(old, new, 1)
              t = t.replace(\n                  '''    fun openSupport() {\n        _state.value = _state.value.copy(supportOpen = true)\n        openLiveChat()\n    }''',\n                  '''    fun openSupport() {\n        _state.value = _state.value.copy(supportOpen = true)\n    }''',\n                  1,\n              )\n              p.write_text(t)\n              print('ViewModel patched')\n          else:\n              print('ViewModel already')\n\n          # --- NavGraph ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/navigation/NavGraph.kt')\n          t = p.read_text()\n          if 'onStartLiveChat' not in t:\n              t = t.replace(\n                  'onSendLiveChat = viewModel::sendLiveChatMessage,',\n                  'onStartLiveChat = { topic, msg -> viewModel.startLiveChat(topic, msg) },\n                onSendLiveChat = viewModel::sendLiveChatMessage,',\n              )\n              p.write_text(t)\n              print('NavGraph patched')\n          else:\n              print('NavGraph already')\n\n          # --- DriverShell ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/DriverShell.kt')\n          t = p.read_text()\n          if 'onStartLiveChat' not in t:\n              t = t.replace(\n                  'onSendLiveChat: (String) -> Unit = {},',\n                  'onStartLiveChat: (String, String) -> Unit = { _, _ -> },\n    onSendLiveChat: (String) -> Unit = {},',\n              )\n              t = t.replace(\n                  '''            SupportCenter(\n                state = state,\n                onBack = onCloseSupport,\n                onSendLiveChat = onSendLiveChat,\n''',\n                  '''            SupportCenter(\n                state = state,\n                onBack = onCloseSupport,\n                onStartLiveChat = onStartLiveChat,\n                onSendLiveChat = onSendLiveChat,\n''',\n              )\n              p.write_text(t)\n              print('DriverShell patched')\n          else:\n              print('DriverShell already')\n\n          # --- SupportCenter ---
          p = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/support/SupportCenter.kt')\n          t = p.read_text()\n          if 'LiveChatTopicSetup' not in t:\n              t = t.replace(\n                  '''fun SupportCenter(\n    state: DriverUiState,\n    onBack: () -> Unit,\n    onSendLiveChat: (String) -> Unit,\n''',\n                  '''fun SupportCenter(\n    state: DriverUiState,\n    onBack: () -> Unit,\n    onStartLiveChat: (topic: String, message: String) -> Unit,\n    onSendLiveChat: (String) -> Unit,\n''',\n              )\n              t = t.replace(\n                  'onLiveChat = { screen = "live" },',\n                  'onLiveChat = { screen = "live-setup" },',\n              )\n              old = '''                    "live" -> LiveChatPanel(\n                        state = state,\n                        onSend = onSendLiveChat,\n                    )\n'''\n              new = '''                    "live-setup" -> LiveChatTopicSetup(\n                        busy = state.liveChatLoading,\n                        error = state.liveChatError,\n                        onBack = { screen = "menu" },\n                        onStart = { topic, msg ->\n                            onStartLiveChat(topic, msg)\n                            screen = "live"\n                        },\n                    )\n                    "live" -> LiveChatPanel(\n                        state = state,\n                        onSend = onSendLiveChat,\n                    )\n'''\n              assert old in t\n              t = t.replace(old, new, 1)\n              setup = '''\nprivate data class DriverHelpTopic(val id: String, val label: String)\n\nprivate val DRIVER_HELP_TOPICS = listOf(\n    DriverHelpTopic("order_issue", "Order issue"),\n    DriverHelpTopic("payment", "Payment / cash"),\n    DriverHelpTopic("app_bug", "App problem"),\n    DriverHelpTopic("store_call", "Store call (N/K)"),\n    DriverHelpTopic("account", "Account / documents"),\n    DriverHelpTopic("other", "Other"),\n)\n\n@Composable\nprivate fun LiveChatTopicSetup(\n    busy: Boolean,\n    error: String?,\n    onBack: () -> Unit,\n    onStart: (topic: String, message: String) -> Unit,\n) {\n    val cs = MaterialTheme.colorScheme\n    var selected by remember { mutableStateOf<String?>(null) }\n    var message by remember { mutableStateOf("") }\n    Column(\n        Modifier.fillMaxWidth().verticalScroll(rememberScrollState()).padding(bottom = 24.dp),\n    ) {\n        Text("Before live chat", style = MaterialTheme.typography.titleLarge, fontWeight = FontWeight.Bold)\n        Spacer(Modifier.height(6.dp))\n        Text(\n            "Pick a topic and write a short message so support can help faster.",\n            style = MaterialTheme.typography.bodyMedium,\n            color = cs.onSurfaceVariant,\n        )\n        Spacer(Modifier.height(16.dp))\n        Text("Topic", fontWeight = FontWeight.SemiBold, style = MaterialTheme.typography.titleSmall)\n        Spacer(Modifier.height(8.dp))\n        DRIVER_HELP_TOPICS.forEach { topic ->\n            val active = selected == topic.id\n            Row(\n                Modifier.fillMaxWidth().padding(vertical = 4.dp)\n                    .clip(RoundedCornerShape(14.dp))\n                    .background(if (active) FreshGreen.copy(alpha = 0.15f) else cs.surface)\n                    .border(1.dp, if (active) FreshGreen else cs.outline.copy(alpha = 0.3f), RoundedCornerShape(14.dp))\n                    .clickable { selected = topic.id }\n                    .padding(horizontal = 14.dp, vertical = 12.dp),\n                verticalAlignment = Alignment.CenterVertically,\n            ) {\n                Text(topic.label, modifier = Modifier.weight(1f), fontWeight = if (active) FontWeight.Bold else FontWeight.Medium)\n            }\n        }\n        Spacer(Modifier.height(16.dp))\n        Text("Message", fontWeight = FontWeight.SemiBold, style = MaterialTheme.typography.titleSmall)\n        Spacer(Modifier.height(6.dp))\n        OutlinedTextField(\n            value = message,\n            onValueChange = { message = it },\n            modifier = Modifier.fillMaxWidth(),\n            minLines = 3,\n            maxLines = 5,\n            placeholder = { Text("Describe the issue...") },\n        )\n        if (!error.isNullOrBlank()) {\n            Spacer(Modifier.height(8.dp))\n            Text(error, color = FreshError, style = MaterialTheme.typography.bodySmall)\n        }\n        Spacer(Modifier.height(16.dp))\n        Button(\n            onClick = { val topic = selected ?: return@Button; onStart(topic, message.trim()) },\n            enabled = selected != null && !busy,\n            modifier = Modifier.fillMaxWidth().height(52.dp),\n            shape = RoundedCornerShape(16.dp),\n        ) {\n            if (busy) CircularProgressIndicator(Modifier.size(20.dp), strokeWidth = 2.dp, color = cs.onPrimary)\n            else Text("Start live chat", fontWeight = FontWeight.Bold)\n        }\n        Spacer(Modifier.height(8.dp))\n        Text("Only support can close the conversation.", style = MaterialTheme.typography.labelSmall, color = cs.onSurfaceVariant)\n    }\n}\n\n'''\n              t = t.replace('@Composable\nprivate fun LiveChatPanel', setup + '@Composable\nprivate fun LiveChatPanel', 1)\n              p.write_text(t)\n              print('SupportCenter patched')\n          else:\n              print('SupportCenter already')\n\n          # Ensure LiveChatConsole close enabled when null\n          p = Path('src/components/support/LiveChatConsole.tsx')\n          t = p.read_text()\n          t2 = t.replace(\n              "disabled={closing || active.session_status !== 'open'}",\n              "disabled={closing || active.session_status === 'closed'}",\n          )\n          if t2 != t:\n              p.write_text(t2)\n              print('LiveChatConsole close fixed')\n          else:\n              print('LiveChatConsole close already fixed')\n\n          print('DONE')\n          PY\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add -A\n          git status\n          git commit -m "feat(support): driver topic before live chat; only support can close" || echo no-commit\n          git push\n