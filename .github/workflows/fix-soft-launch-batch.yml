name: Soft-launch batch fixes
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-soft-launch-batch.py"
      - ".github/workflows/fix-soft-launch-batch.yml"
jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply batch fixes
        run: python3 scripts/fix-soft-launch-batch.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no change; else
            git commit -m "fix: soft-launch batch (CI TS, store home, rewards, support contact)"
            git push
          fi
      - name: npm ci + typecheck
        run: |
          npm ci
          npm run typecheck
