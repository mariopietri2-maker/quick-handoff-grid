name: Apply empty cart and reorder
on:
  push:
    paths:
      - 'scripts/apply_empty_cart_and_reorder.py'
      - '.github/workflows/apply-empty-cart-and-reorder.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_empty_cart_and_reorder.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): empty cart UX + order again from history" || exit 0
          git push
