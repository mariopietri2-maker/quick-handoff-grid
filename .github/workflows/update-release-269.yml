name: Update release 2.6.9
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Edit release title and body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(cat <<'EOF'
          ## Fresh Meal latest Android builds

          **Driver APK** — version **2.6.9-native** (build 260)
          - Fix: N-store call card shows without needing a regular order offer
          - Supports call_role K and both
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh2go-driver-native-debug.apk

          **Customer APK** — version **2.7.0-native** (build 252)
          https://github.com/mariopietri2-maker/quick-handoff-grid/releases/download/mobile-apks-v1/fresh2go-customer-native-debug.apk

          Only the latest build is kept on this release.
          EOF
          )
          gh release edit mobile-apks-v1 \
            --repo mariopietri2-maker/quick-handoff-grid \
            --title "Driver 2.6.9-native (260) · Customer 2.7.0-native (252)" \
            --notes "$BODY"
          echo "Release updated."
          gh release view mobile-apks-v1 --repo mariopietri2-maker/quick-handoff-grid
