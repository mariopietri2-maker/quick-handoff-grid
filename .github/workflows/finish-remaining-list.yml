name: Finish remaining list
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/finish-remaining-list.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch remaining items
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          # 1) Customer notif banner
          c = Path('src/pages/CustomerApp.tsx')
          ct = c.read_text(encoding='utf-8')
          if 'Ενεργοποίησε ειδοποιήσεις' not in ct:
              if "from '@/lib/notifications'" not in ct:
                  ct = ct.replace(
                      "import { isStoreOpenNow, nextOpeningLabel } from '@/lib/store-hours';",
                      "import { isStoreOpenNow, nextOpeningLabel } from '@/lib/store-hours';\nimport { requestNotificationPermission } from '@/lib/notifications';",
                  )
              if 'notifNeed' not in ct:
                  ct = ct.replace(
                      "  const [debouncedSearch, setDebouncedSearch] = useState('');",
                      "  const [debouncedSearch, setDebouncedSearch] = useState('');\n  const [notifNeed, setNotifNeed] = useState(false);\n  useEffect(() => {\n    if (typeof window === 'undefined' || !('Notification' in window)) return;\n    setNotifNeed(Notification.permission === 'default');\n  }, []);",
                  )
              ct = ct.replace(
                  '        {/* Main feed */}',
                  '''        {notifNeed && (
          <div className="mx-4 mb-3 rounded-xl border border-primary/30 bg-primary/10 px-3 py-2.5 flex items-center gap-2">
            <p className="text-[12px] flex-1 text-foreground font-medium leading-snug">
              Ενεργοποίησε ειδοποιήσεις για την πορεία της παραγγελίας σου.
            </p>
            <button
              type="button"
              className="shrink-0 rounded-lg bg-primary text-primary-foreground text-[11px] font-bold px-3 py-1.5"
              onClick={async () => {
                await requestNotificationPermission();
                setNotifNeed(typeof Notification !== 'undefined' && Notification.permission === 'default');
              }}
            >
              OK
            </button>
          </div>
        )}
        {/* Main feed */}''',
              )
              c.write_text(ct, encoding='utf-8')
              print('customer banner')
          else:
              print('customer already')

          # 2) Offer card distance + store
          p = Path('src/components/driver/OneAtATimeOfferCard.tsx')
          t = p.read_text(encoding='utf-8')
          if 'distanceKm' not in t:
              t = t.replace(
          '''interface OneAtATimeOfferCardProps {
  id: string;
  /** «Νέα παραγγελία» or «Αυξημένη ζήτηση» */
  kicker: string;
  /** Exact payout locked in on accept. */
  priceEur: number;
  /** Absolute ISO expiry from `pending_offers.expires_at`. */
  expiresAt?: string | null;
  /** Fallback total window (seconds) when `expiresAt` is missing. */
  timeoutSec?: number;
  onAccept: (id: string) => void;
  onDecline: (id: string) => void;
}''',
          '''interface OneAtATimeOfferCardProps {
  id: string;
  kicker: string;
  priceEur: number;
  expiresAt?: string | null;
  timeoutSec?: number;
  storeName?: string | null;
  distanceKm?: number | null;
  onAccept: (id: string) => void;
  onDecline: (id: string) => void;
}''',
              )
              t = t.replace(
          '''function OneAtATimeOfferCardInner({
  id,
  kicker,
  priceEur,
  expiresAt,
  timeoutSec = 60,
  onAccept,
  onDecline,
}: OneAtATimeOfferCardProps) {''',
          '''function OneAtATimeOfferCardInner({
  id,
  kicker,
  priceEur,
  expiresAt,
  timeoutSec = 60,
  storeName,
  distanceKm,
  onAccept,
  onDecline,
}: OneAtATimeOfferCardProps) {''',
              )
              old = '''      <p className="flex items-center justify-center gap-1.5 pb-2 text-[10.5px] font-medium text-[hsl(var(--driver-text-muted))]">
        <Lock className="h-3 w-3" />
        Οι λεπτομέρειες εμφανίζονται μετά την αποδοχή
      </p>'''
              new = '''      {(storeName || distanceKm != null) ? (
        <p className="flex items-center justify-center gap-2 pb-2 text-[12px] font-semibold text-[hsl(var(--driver-text))] tabular-nums">
          {storeName && <span className="truncate max-w-[12rem]">{storeName}</span>}
          {storeName && distanceKm != null && <span className="text-[hsl(var(--driver-text-muted))]">·</span>}
          {distanceKm != null && <span>{Number(distanceKm).toFixed(1)} χλμ</span>}
        </p>
      ) : (
        <p className="flex items-center justify-center gap-1.5 pb-2 text-[10.5px] font-medium text-[hsl(var(--driver-text-muted))]">
          <Lock className="h-3 w-3" />
          Οι λεπτομέρειες εμφανίζονται μετά την αποδοχή
        </p>
      )}'''
              if old not in t:
                  raise SystemExit('offer lock line missing')
              t = t.replace(old, new)
              p.write_text(t, encoding='utf-8')
              print('offer card')
          else:
              print('offer already')

          d = Path('src/pages/DriverApp.tsx')
          dt = d.read_text(encoding='utf-8')
          if 'distanceKm={(topOffer' not in dt:
              oldc = '''                        <OneAtATimeOfferCard
                          key={topOffer.id}
                          id={topOffer.id}
                          kicker={secondPhase ? 'Αυξημένη ζήτηση' : 'Νέα παραγγελία'}
                          priceEur={topOfferPrice}
                          expiresAt={offerExpiresAt[topOffer.id] ?? null}
                          timeoutSec={offerTimeoutSec}
                          onAccept={acceptOrder}
                          onDecline={handleDecline}
                        />'''
              newc = '''                        <OneAtATimeOfferCard
                          key={topOffer.id}
                          id={topOffer.id}
                          kicker={secondPhase ? 'Αυξημένη ζήτηση' : 'Νέα παραγγελία'}
                          priceEur={topOfferPrice}
                          expiresAt={offerExpiresAt[topOffer.id] ?? null}
                          timeoutSec={offerTimeoutSec}
                          storeName={(topOffer as any).store_name ?? null}
                          distanceKm={(topOffer as any).distance_km != null ? Number((topOffer as any).distance_km) : null}
                          onAccept={acceptOrder}
                          onDecline={handleDecline}
                        />'''
              if oldc not in dt:
                  raise SystemExit('DriverApp usage missing')
              d.write_text(dt.replace(oldc, newc), encoding='utf-8')
              print('driver app')
          else:
              print('driver already')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CustomerApp.tsx src/components/driver/OneAtATimeOfferCard.tsx src/pages/DriverApp.tsx
          if git diff --staged --quiet; then echo no changes; else git commit -m "feat: finish list (notif banner + offer km/store)"; git push; fi
