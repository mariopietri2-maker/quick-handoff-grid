name: All Phases Capacitor Parity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/all-phases-parity.yml"
      - ".github/parity-payloads/**"

jobs:
  parity:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Phase 1 Browse tab nav
        run: python3 .github/parity-payloads/phase1_browse.py

      - name: Phase 1 Repository and ViewModel
        run: python3 .github/parity-payloads/phase1_repo_vm.py

      - name: Fix Browse when-branch and appConfig home UI
        run: python3 .github/parity-payloads/fix_browse_when.py

      - name: Phase 2 3 Driver banners and versions
        run: bash .github/parity-payloads/phase23_driver.sh

      - name: Commit and push
        run: |
          git config user.name parity-bot
          git config user.email parity@freshdelivery.local
          git add -A
          git status
          git commit -m "feat(native): complete all phases — Browse when + appConfig UI + driver banners" || echo Nothing to commit
          git push origin HEAD:main || true
