name: Apply popular and promo rail
on:
  push:
    paths:
      - 'scripts/apply_popular_and_promo_rail.py'
      - '.github/workflows/apply-popular-and-promo-rail.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_popular_and_promo_rail.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): multi-promo home rail + popular menu row" || exit 0
          git push
