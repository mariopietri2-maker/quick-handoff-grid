          mig.write_text('''-- Allow store shell to claim store role (Μητρώο καταστημάτων)
CREATE OR REPLACE FUNCTION public.sync_app_role(p_app text)
RETURNS jsonb
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = public
AS $$
DECLARE
  uid uuid := auth.uid();
  target text;
  cur text;
BEGIN
  IF uid IS NULL THEN
    RETURN jsonb_build_object('ok', false, 'error', 'not_authenticated');
  END IF;

  target := lower(trim(coalesce(p_app, '')));
  IF target NOT IN ('customer', 'driver', 'store') THEN
    RETURN jsonb_build_object('ok', false, 'error', 'invalid_app');
  END IF;

  SELECT role INTO cur FROM public.profiles WHERE user_id = uid;

  -- Do not demote admins / support
  IF EXISTS (
    SELECT 1 FROM public.user_roles ur
    WHERE ur.user_id = uid AND ur.role IN ('admin', 'support')
  ) THEN
    RETURN jsonb_build_object('ok', true, 'role', coalesce(cur, target), 'skipped', true);
  END IF;

  -- Existing store owners keep store even if opening customer shell once
  IF cur = 'store' AND target = 'customer' THEN
    RETURN jsonb_build_object('ok', true, 'role', 'store', 'kept', true);
  END IF;

  UPDATE public.profiles
  SET role = target,
      updated_at = now()
  WHERE user_id = uid;

  IF NOT FOUND THEN
    INSERT INTO public.profiles (user_id, role, full_name)
    VALUES (uid, target, null)
    ON CONFLICT (user_id) DO UPDATE SET role = excluded.role, updated_at = now();
  END IF;

  -- Mirror store membership in user_roles when claiming store
  IF target = 'store' THEN
    INSERT INTO public.user_roles (user_id, role)
    VALUES (uid, 'store')
    ON CONFLICT DO NOTHING;
  END IF;

  RETURN jsonb_build_object('ok', true, 'role', target);
END;
$$;

GRANT EXECUTE ON FUNCTION public.sync_app_role(text) TO authenticated;
''', encoding='utf-8')
