name: Compact receipt v2
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-receipt-compact-v2.py"
      - ".github/workflows/fix-receipt-compact-v2.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-receipt-compact-v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/store/PrintOrderTicket.tsx src/lib/print-order-escpos.ts
          git commit -m "fix(print): same style, efood-like density, no driver" || true
          git push || true
