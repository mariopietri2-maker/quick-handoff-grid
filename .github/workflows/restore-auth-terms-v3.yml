name: Restore Auth terms v3
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-auth-terms-v3.yml"
      - "scripts/patch_auth_terms.py"
      - "scripts/patch_native_terms.py"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore AuthPage from history
        run: |
          set -euo pipefail
          curl -fsSL -o src/pages/AuthPage.tsx "https://raw.githubusercontent.com/mariopietri2-maker/quick-handoff-grid/6e2e51dcc3a8787d7d7880080b6f343ceea40f04/src/pages/AuthPage.tsx"
          python3 -c "from pathlib import Path; t=Path('src/pages/AuthPage.tsx').read_text(); assert 'export default function AuthPage' in t; print(len(t))"
      - run: python3 scripts/patch_auth_terms.py
      - run: python3 scripts/patch_native_terms.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AuthPage.tsx native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/LoginScreen.kt
          git status
          git commit -m "feat(auth): require Terms and Privacy on signup with links" || true
          git push || true
