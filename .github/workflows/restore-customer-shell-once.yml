name: Restore CustomerShell Once

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-customer-shell-once.yml"
      - "native-customer/_restore_shell.b64"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode CustomerShell from b64 artifact in repo
        run: |
          set -euo pipefail
          python3 <<'PY'
          import gzip, base64
          from pathlib import Path
          b64 = Path('native-customer/_restore_shell.b64').read_text().strip()
          data = gzip.decompress(base64.b64decode(b64))
          path = Path('native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt')
          path.write_bytes(data)
          print('wrote', path, 'bytes', len(data))
          assert len(data) > 10000, len(data)
          assert data.startswith(b'package '), data[:40]
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(customer): restore full Uber Eats CustomerShell (was LOAD_FROM_ARTIFACTS placeholder)"
          git push
