name: Wire advertising admin tab
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/wire-advertising-admin.yml"
      - "src/components/admin/AdminAdvertisingPanel.tsx"
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch AdminSidebar + AdminApp
        run: |
          python3 << 'PY'
          from pathlib import Path

          side = Path('src/components/admin/AdminSidebar.tsx')
          t = side.read_text(encoding='utf-8')
          if "id: 'advertising'" not in t:
              t = t.replace(
                  "{ id: 'ai_hero_cards', label: '✨ AI Cards & Motion' },",
                  "{ id: 'ai_hero_cards', label: '✨ AI Cards & Motion' },\n      { id: 'advertising', label: '📢 Διαφημίσεις' },",
              )
              side.write_text(t, encoding='utf-8')
              print('sidebar ok')
          else:
              print('sidebar already')

          app = Path('src/pages/AdminApp.tsx')
          t = app.read_text(encoding='utf-8')
          if 'AdminAdvertisingPanel' not in t:
              t = t.replace(
                  "const AdminStorePhotos = lazy(() => import('@/components/admin/AdminStorePhotos'));",
                  "const AdminStorePhotos = lazy(() => import('@/components/admin/AdminStorePhotos'));\nconst AdminAdvertisingPanel = lazy(() => import('@/components/admin/AdminAdvertisingPanel'));",
              )
              t = t.replace(
                  "      case 'ai_hero_cards':\n        return <AiHeroCardsAdmin />;",
                  "      case 'ai_hero_cards':\n        return <AiHeroCardsAdmin />;\n      case 'advertising':\n        return <AdminAdvertisingPanel />;",
              )
              app.write_text(t, encoding='utf-8')
              print('AdminApp ok')
          else:
              print('AdminApp already')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/admin/AdminSidebar.tsx src/pages/AdminApp.tsx
          if git diff --staged --quiet; then echo no changes; else git commit -m "feat(admin): wire Διαφημίσεις tab"; git push; fi
