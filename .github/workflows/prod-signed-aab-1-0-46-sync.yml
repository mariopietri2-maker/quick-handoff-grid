name: Production signed AAB 1.0.46 synced
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-signed-aab-1-0-46-sync.yml"
      - "scripts/sync-native-versions-1-0-46.py"
      - "src/lib/apk-downloads.ts"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync versions 1.0.46
        run: |
          python3 scripts/sync-native-versions-1-0-46.py
          python3 scripts/greek-tagline.py 2>/dev/null || true
          python3 scripts/fix-promobanner-storeid.py 2>/dev/null || true
          python3 scripts/patch_native_terms.py 2>/dev/null || true

      - name: Commit version sync if needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/apk-downloads.ts native-customer/app/build.gradle.kts native-driver/app/build.gradle.kts || true
          git commit -m "chore: version parity 1.0.46 / 7236600" || true
          git push || true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL --retry 5 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Keystore
        run: |
          set -euo pipefail
          mkdir -p mobile-signing
          test -n "${PLAY_CUSTOMER_KEYSTORE_B64:-}" || { echo 'missing PLAY_CUSTOMER_KEYSTORE_B64'; exit 1; }
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          KEYPASS="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          cat > mobile-signing/key.properties <<EOF
          storePassword=${PLAY_STORE_PASSWORD}
          keyPassword=${KEYPASS}
          keyAlias=${ALIAS}
          storeFile=fresh2go-customer-upload.jks
          customerStoreFile=fresh2go-customer-upload.jks
          EOF

      - name: Bundle release
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          cp -R ../native-driver/gradle .
          cp ../native-driver/gradlew .
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PLAY_KEY_ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          export PLAY_KEY_PASSWORD="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Upload signed AAB
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AAB=$(find native-customer/app/build/outputs/bundle -name '*.aab' | head -1)
          test -n "$AAB"
          cp "$AAB" /tmp/fresh2go-customer-native-signed.aab
          cp "$AAB" /tmp/fresh2go-customer-native-v1.0.46-vc7236600-signed.aab
          TAG=mobile-apks-v1
          for name in fresh2go-customer-native-signed.aab fresh2go-customer-native-v1.0.46-vc7236600-signed.aab; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" 2>/dev/null || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" /tmp/fresh2go-customer-native-signed.aab /tmp/fresh2go-customer-native-v1.0.46-vc7236600-signed.aab --clobber
          echo AAB_1_0_46_OK
