name: Phase1 Capacitor Parity

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/phase1-capacitor-parity.yml"
      - "native-customer/_shell_phase1.b64"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply Phase 1 patches
        run: |
          set -euo pipefail
          python3 .github/scripts/phase1-capacitor-parity.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          if git diff --staged --quiet; then echo No changes; exit 0; fi
          git commit -m "feat(native-customer): Phase 1 Capacitor parity — Browse, admin config, promos, active order"
          git push
