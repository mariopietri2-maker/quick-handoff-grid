name: Apply homepage stats function
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply get_homepage_stats
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ojkesspghyqmjmupybva
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret missing"
            exit 1
          fi
          SQL=$(cat supabase/migrations/20261106150000_public_homepage_stats.sql)
          curl -fsS -X POST "https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(python3 -c 'import json,os; print(json.dumps({"query": open("supabase/migrations/20261106150000_public_homepage_stats.sql").read()}))')"
          echo
          echo "Applied get_homepage_stats"
