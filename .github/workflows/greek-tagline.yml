name: Greek tagline
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/greek-tagline.py"
      - ".github/workflows/greek-tagline.yml"
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/greek-tagline.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "i18n: Greek tagline under Fresh2GO (splash + defaults)" || true
          git push || true
