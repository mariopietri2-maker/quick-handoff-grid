name: Upload customer APK 1.0.15
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/upload-customer-apk-1015.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Ensure version 1.0.15
        run: |
          grep -E 'versionCode|versionName' native-customer/app/build.gradle.kts | head -4
          [ -f scripts/disable-google-login.py ] && python3 scripts/disable-google-login.py || true
          [ -f scripts/fix-inapp-signup.py ] && python3 scripts/fix-inapp-signup.py || true
      - name: Build + upload APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> ~/.gradle/gradle.properties
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-customer/
          chmod +x native-customer/gradlew
          echo "sdk.dir=$ANDROID_HOME" > native-customer/local.properties
          cd native-customer
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/*.apk /tmp/fresh2go-customer-native-debug.apk
          ls -lh /tmp/fresh2go-customer-native-debug.apk
          TAG=mobile-apks-v1
          id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name=="fresh2go-customer-native-debug.apk") | .id' || true)
          [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          gh release upload "$TAG" /tmp/fresh2go-customer-native-debug.apk --clobber
          echo APK_1_0_15_UPLOADED
