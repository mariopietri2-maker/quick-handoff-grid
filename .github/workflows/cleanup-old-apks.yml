name: Cleanup old APKs
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Keep only the latest native debug builds (current CI upload names)
          KEEP='fresh-driver-native-debug.apk|fresh-driver-native-debug.aab|fresh-customer-native-debug.apk|fresh-customer-native-debug.aab'
          # Also keep small preview images if present
          KEEP_IMG='\.png$'

          assets=$(gh api repos/mariopietri2-maker/quick-handoff-grid/releases/tags/mobile-apks-v1 --jq '.assets[] | "\(.id)\t\(.name)"')
          while IFS=$'\t' read -r id name; do
            [ -z "$id" ] && continue
            if echo "$name" | grep -Eq "$KEEP|$KEEP_IMG"; then
              echo "KEEP  $name"
            else
              echo "DELETE $name (id=$id)"
              gh api -X DELETE "repos/mariopietri2-maker/quick-handoff-grid/releases/assets/$id"
            fi
          done <<< "$assets"

          echo "--- Remaining assets ---"
          gh api repos/mariopietri2-maker/quick-handoff-grid/releases/tags/mobile-apks-v1 --jq '.assets[].name'
