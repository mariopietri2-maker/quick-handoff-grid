name: Cleanup old APKs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organize releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')

          echo "Driver $DRIVER_NAME ($DRIVER_CODE) Customer $CUST_NAME ($CUST_CODE)"

          if ! gh release view mobile-apks-archive >/dev/null 2>&1; then
            gh release create mobile-apks-archive \
              --title "Archive — older Android builds" \
              --notes "Older APK/AAB builds. Use mobile-apks-v1 for latest only." \
              --prerelease
          fi

          gh api repos/${{ github.repository }}/releases/tags/mobile-apks-v1 --jq '.assets[] | [.id,.name,.browser_download_url] | @tsv' > /tmp/assets.tsv || true

          TMP=$(mktemp -d)
          while IFS=$'\t' read -r id name url; do
            [ -z "${id:-}" ] && continue
            case "$name" in
              fresh2go-driver-native-debug.apk|fresh2go-driver-native-debug.aab|fresh2go-customer-native-debug.apk|fresh2go-customer-native-debug.aab)
                echo "KEEP $name"
                ;;
              *)
                echo "ARCHIVE $name"
                if curl -fsSL -o "$TMP/$name" "$url"; then
                  gh release upload mobile-apks-archive "$TMP/$name" --clobber || true
                fi
                gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
                rm -f "$TMP/$name"
                ;;
            esac
          done < /tmp/assets.tsv
          rm -rf "$TMP"

          TITLE="Latest — Driver ${DRIVER_NAME} · Customer ${CUST_NAME}"
          NOTES="## Fresh2GO — latest Android builds only

Only **current native** APKs/AABs live here. Older files: [mobile-apks-archive](https://github.com/${{ github.repository }}/releases/tag/mobile-apks-archive).

### Install

| App | Version | Download |
|-----|---------|----------|
| Driver | ${DRIVER_NAME} (${DRIVER_CODE}) | [APK](https://github.com/${{ github.repository }}/releases/download/mobile-apks-v1/fresh2go-driver-native-debug.apk) |
| Customer | ${CUST_NAME} (${CUST_CODE}) | [APK](https://github.com/${{ github.repository }}/releases/download/mobile-apks-v1/fresh2go-customer-native-debug.apk) |

### Other channels
- Play Store AABs: [play-store-aabs-v1](https://github.com/${{ github.repository }}/releases/tag/play-store-aabs-v1)
- Archive: [mobile-apks-archive](https://github.com/${{ github.repository }}/releases/tag/mobile-apks-archive)
"
          gh release edit mobile-apks-v1 --title "$TITLE" --notes "$NOTES"

          if gh release view play-store-aabs-v1 >/dev/null 2>&1; then
            gh release edit play-store-aabs-v1 \
              --title "Play Store AABs (signed)" \
              --notes "Signed AABs for Google Play Console only. Phone sideload: use mobile-apks-v1." || true
          fi

          echo "Remaining on mobile-apks-v1:"
          gh release view mobile-apks-v1 --json assets --jq '.assets[].name'
