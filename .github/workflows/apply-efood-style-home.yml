name: Apply efood-style home Fresh2GO
on:
  push:
    paths:
      - 'scripts/apply_efood_style_home.py'
      - '.github/workflows/apply-efood-style-home.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_efood_style_home.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): efood-like discovery in Fresh2GO style" || exit 0
          git push
