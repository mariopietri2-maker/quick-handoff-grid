name: Apply splash Fresh2GO name
on:
  push:
    paths:
      - 'scripts/apply_splash_fresh2go_name.py'
      - '.github/workflows/apply-splash-fresh2go-name.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_splash_fresh2go_name.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "brand: splash default Fresh2GO" || exit 0
          git push
