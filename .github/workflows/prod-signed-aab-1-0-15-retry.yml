name: Retry signed AAB 1.0.15
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-signed-aab-1-0-15-retry.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
      PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Pre-download Gradle (longer timeout)
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle/wrapper/dists
          curl -L --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 300 \
            -o /tmp/gradle-8.14.3-all.zip \
            https://services.gradle.org/distributions/gradle-8.14.3-all.zip || \
          curl -L --retry 5 -o /tmp/gradle-8.14.3-all.zip \
            https://github.com/gradle/gradle-distributions/releases/download/v8.14.3/gradle-8.14.3-all.zip || true
          ls -lh /tmp/gradle-8.14.3-all.zip || true
      - name: Bump + patches
        run: |
          set -euo pipefail
          sed -i 's/versionCode = 7233400/versionCode = 7233500/' native-customer/app/build.gradle.kts || true
          sed -i 's/versionCode = 7233300/versionCode = 7233500/' native-customer/app/build.gradle.kts || true
          sed -i 's/versionName = "1.0.14"/versionName = "1.0.15"/' native-customer/app/build.gradle.kts || true
          sed -i 's/versionName = "1.0.13"/versionName = "1.0.15"/' native-customer/app/build.gradle.kts || true
          [ -f scripts/disable-google-login.py ] && python3 scripts/disable-google-login.py || true
          [ -f scripts/fix-inapp-signup.py ] && python3 scripts/fix-inapp-signup.py || true
          grep version native-customer/app/build.gradle.kts | head -4
      - name: Keystore
        run: |
          set -euo pipefail
          mkdir -p mobile-signing
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          KEYPASS="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          cat > mobile-signing/key.properties <<EOF
          storePassword=${PLAY_STORE_PASSWORD}
          keyPassword=${KEYPASS}
          keyAlias=${ALIAS}
          storeFile=fresh2go-customer-upload.jks
          customerStoreFile=fresh2go-customer-upload.jks
          EOF
      - name: Bundle release
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.connectionTimeout=120000" >> ~/.gradle/gradle.properties
          echo "systemProp.org.gradle.internal.http.socketTimeout=120000" >> ~/.gradle/gradle.properties
          cp -R ../native-driver/gradle .
          cp ../native-driver/gradlew .
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          export PLAY_KEY_ALIAS="${PLAY_KEY_ALIAS:-fresh2go-customer}"
          export PLAY_KEY_PASSWORD="${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}"
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AAB=$(find native-customer/app/build/outputs/bundle -name '*.aab' | head -1)
          cp "$AAB" /tmp/fresh2go-customer-native-signed.aab
          cp "$AAB" /tmp/fresh2go-customer-native-v1.0.15-vc7233500-signed.aab
          TAG=mobile-apks-v1
          for name in fresh2go-customer-native-signed.aab fresh2go-customer-native-v1.0.15-vc7233500-signed.aab; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" 2>/dev/null || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" /tmp/fresh2go-customer-native-signed.aab /tmp/fresh2go-customer-native-v1.0.15-vc7233500-signed.aab --clobber
          echo AAB_OK
