name: Fix arrow icon + rebuild customer AAB APK
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-keyboard-arrow-feedback.py"
      - ".github/workflows/fix-arrow-rebuild-aab.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-keyboard-arrow-feedback.py
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "fix(customer): ChevronRight for feedback row" || true
          git push || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Mapbox
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          cp -R native-driver/gradle native-customer/
          cp native-driver/gradlew native-customer/
          chmod +x native-customer/gradlew
          echo "sdk.dir=$ANDROID_HOME" > native-customer/local.properties
      - name: Build APK + AAB
        working-directory: native-customer
        run: |
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace \
            || ./gradlew :app:assembleDebug :app:bundleDebug --no-daemon --stacktrace
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-customer/app/build/outputs/apk/debug/*.apk dist/fresh2go-customer-native-debug.apk
          CAAB=$(find native-customer/app/build/outputs -name '*.aab' | head -1)
          cp "$CAAB" dist/fresh2go-customer-native.aab
          cp "$CAAB" dist/fresh2go-customer-native-v1.0.13-vc7233300.aab
          ls -lah dist/
          TAG=mobile-apks-v1
          for f in dist/*; do
            name=$(basename "$f")
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" 2>/dev/null || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" dist/* --clobber
          echo DONE_1_0_13
