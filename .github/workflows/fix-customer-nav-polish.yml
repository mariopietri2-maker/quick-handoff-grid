name: Customer nav polish
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-customer-nav-polish.py"
      - ".github/workflows/fix-customer-nav-polish.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-customer-nav-polish.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git commit -m "fix(customer): Track CTAs, auto-track active order, Browse vs Home search" || true
          git push || true
