name: Label release from gradle versions
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update GitHub release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/mobile-apks-v1
        run: |
          set -euo pipefail
          DRIVER_NAME=$(grep -E 'versionName\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          DRIVER_CODE=$(grep -E 'versionCode\s*=' native-driver/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          CUST_NAME=$(grep -E 'versionName\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          CUST_CODE=$(grep -E 'versionCode\s*=' native-customer/app/build.gradle.kts | head -1 | sed -E 's/[^0-9]//g')
          echo "Driver $DRIVER_NAME ($DRIVER_CODE) · Customer $CUST_NAME ($CUST_CODE)"
          BODY=$(cat <<EOF
          ## fresh2go latest Android builds

          **Latest first**

          1. **Driver APK** — **${DRIVER_NAME}** (build ${DRIVER_CODE})
          ${RELEASE_BASE}/fresh2go-driver-native-debug.apk

          2. **Customer APK** — **${CUST_NAME}** (build ${CUST_CODE})
          ${RELEASE_BASE}/fresh2go-customer-native-debug.apk

          Only the latest build is kept on this release.
          EOF
          )
          gh release edit mobile-apks-v1 \
            --repo "${{ github.repository }}" \
            --title "Driver ${DRIVER_NAME} (${DRIVER_CODE}) · Customer ${CUST_NAME} (${CUST_CODE})" \
            --notes "$BODY"
