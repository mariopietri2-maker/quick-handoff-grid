name: Infobip SMS setup
on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/send-phone-otp/**"
      - "scripts/reenable-phone-sms-ui.py"
      - ".github/workflows/infobip-sms.yml"
jobs:
  wire:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/reenable-phone-sms-ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(sms): Infobip provider + re-enable phone SMS UI" || true
          git push || true
