name: Premium Native Upgrade
on:
  workflow_dispatch:
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium UX patches
        run: |
          python3 << 'PY'
          from pathlib import Path

          # ── CustomerShell: Active order banner + richer store card meta ──
          shell = Path('native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt')
          text = shell.read_text()

          # Inject ActiveOrderBanner composable if missing
          if 'fun ActiveOrderBanner' not in text:
              banner = r'''
@Composable
private fun ActiveOrderBanner(order: OrderUi, onTrack: () -> Unit) {
    val statusText = when (order.order.status) {
        "pending", "placed" -> "Σε αναμονή επιβεβαίωσης"
        "accepted", "confirmed" -> "Έγινε δεκτή"
        "preparing" -> "Ετοιμάζεται"
        "ready" -> "Έτοιμη για παραλαβή"
        "picked_up", "on_the_way", "in_transit" -> "Ο οδηγός έρχεται"
        "arrived" -> "Ο οδηγός παρέλαβε"
        else -> "Σε εξέλιξη"
    }
    Surface(
        onClick = onTrack,
        modifier = Modifier
            .fillMaxWidth()
            .padding(horizontal = 16.dp, vertical = 8.dp),
        shape = RoundedCornerShape(16.dp),
        color = UberGreen,
        shadowElevation = 6.dp,
    ) {
        Row(
            Modifier.padding(horizontal = 16.dp, vertical = 14.dp),
            verticalAlignment = Alignment.CenterVertically,
        ) {
            Box(
                Modifier
                    .size(40.dp)
                    .clip(CircleShape)
                    .background(Color.White.copy(alpha = 0.22f)),
                contentAlignment = Alignment.Center,
            ) {
                Icon(Icons.Outlined.Map, null, tint = Color.White, modifier = Modifier.size(22.dp))
            }
            Spacer(Modifier.width(12.dp))
            Column(Modifier.weight(1f)) {
                Text(
                    "ΕΝΕΡΓΗ ΠΑΡΑΓΓΕΛΙΑ",
                    color = Color.White.copy(alpha = 0.85f),
                    style = MaterialTheme.typography.labelSmall,
                    fontWeight = FontWeight.Bold,
                )
                Text(statusText, color = Color.White, fontWeight = FontWeight.Bold, style = MaterialTheme.typography.titleSmall)
                order.storeName?.let {
                    Text(it, color = Color.White.copy(alpha = 0.9f), style = MaterialTheme.typography.bodySmall, maxLines = 1, overflow = TextOverflow.Ellipsis)
                }
            }
            Text("›", color = Color.White, fontWeight = FontWeight.Bold, fontSize = 22.sp)
        }
    }
}

'''
              # Insert before HomeTab
              text = text.replace(
                  '@Composable\nprivate fun HomeTab(',
                  banner + '@Composable\nprivate fun HomeTab(',
              )

          # Wire banner into HomeTab after address/search header — inject after first item block ends
          if 'ActiveOrderBanner(' not in text.split('fun HomeTab')[1][:3000] if 'fun HomeTab' in text else '':
              # Add active order item near top of LazyColumn after search
              old = '''        item {
            Row(
                Modifier
                    .horizontalScroll(rememberScrollState())
                    .padding(horizontal = 16.dp, vertical = 8.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp),
            ) {
                UberFilterChip("Όλα", selected = !filterOpen) { filterOpen = false }
                UberFilterChip("Ανοιχτά", selected = filterOpen) { filterOpen = true }
                TextButton(onClick = onRefresh) {
                    Text("Ανανέωση", color = UberGreen, fontWeight = FontWeight.Bold)
                }
            }
        }'''
              new = '''        // Premium: active in-flight order banner
        state.activeOrders.firstOrNull()?.let { active ->
            item {
                ActiveOrderBanner(order = active, onTrack = { /* wired via parent track */ })
            }
        }
        item {
            Row(
                Modifier
                    .horizontalScroll(rememberScrollState())
                    .padding(horizontal = 16.dp, vertical = 8.dp),
                horizontalArrangement = Arrangement.spacedBy(8.dp),
            ) {
                UberFilterChip("Όλα", selected = !filterOpen) { filterOpen = false }
                UberFilterChip("Ανοιχτά", selected = filterOpen) { filterOpen = true }
                UberFilterChip("Γρήγορα", selected = false) { }
                TextButton(onClick = onRefresh) {
                    Text("Ανανέωση", color = UberGreen, fontWeight = FontWeight.Bold)
                }
            }
        }'''
              if old in text:
                  text = text.replace(old, new, 1)

          # Improve UberStoreCard meta line — more premium ETA + fee wording
          text = text.replace(
              '"★ 4.8 · 25–35 λεπτά · Παράδοση"',
              '"★ 4.8 · 20–35 λεπτά · από €0.99"',
          )

          shell.write_text(text)
          print('CustomerShell patched')

          # ── Driver HomeScreen: premium GO slide bar instead of plain Switch ──
          home = Path('native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/home/HomeScreen.kt')
          h = home.read_text()

          # Add GoOnlineSlideBar composable if missing
          if 'fun GoOnlineSlideBar' not in h:
              go_bar = r'''
@Composable
private fun GoOnlineSlideBar(
    online: Boolean,
    enabled: Boolean,
    onToggle: (Boolean) -> Unit,
) {
    val label = if (online) "Σε υπηρεσία — πάτα για εκτός" else "Πάτα για Διαθέσιμος"
    Button(
        onClick = { if (enabled) onToggle(!online) },
        enabled = enabled,
        modifier = Modifier
            .fillMaxWidth()
            .height(56.dp),
        shape = RoundedCornerShape(28.dp),
        colors = ButtonDefaults.buttonColors(
            containerColor = if (online) FreshGreen else Color(0xFF1A1F26),
            contentColor = if (online) Color.Black else Color.White,
            disabledContainerColor = Color(0xFF2A2F36),
        ),
        elevation = ButtonDefaults.buttonElevation(defaultElevation = 8.dp),
    ) {
        Text(
            if (online) "●  $label" else "○  $label",
            fontWeight = FontWeight.Bold,
            style = MaterialTheme.typography.titleSmall,
        )
    }
}

'''
              # Append before last closing of file / after EmptySheet
              if 'private fun EmptySheet' in h:
                  h = h.replace('private fun EmptySheet', go_bar + 'private fun EmptySheet', 1)
              else:
                  h = h + '\n' + go_bar

          # Replace Switch with GoOnlineSlideBar in top bar region — soften by adding GO bar in bottom sheet header
          if 'GoOnlineSlideBar(' not in h:
              # Insert GO bar above the bottom Card when no active trip
              marker = 'Card(\n                Modifier\n                    .fillMaxWidth()\n                    .heightIn(max = 340.dp)'
              insert = '''GoOnlineSlideBar(
                online = state.online,
                enabled = state.driverActive && !state.busy,
                onToggle = onToggleOnline,
            )
            Spacer(Modifier.height(10.dp))
            Card(
                Modifier
                    .fillMaxWidth()
                    .heightIn(max = 340.dp)'''
              if marker in h:
                  h = h.replace(marker, insert, 1)

          home.write_text(h)
          print('HomeScreen patched')

          # Fix TurnByTurnBanner missing imports / Surface usage — guard compile
          if 'private fun TurnByTurnBanner' in h:
              # Ensure Surface import path exists via material3 already imported
              if 'androidx.compose.material3.Surface' not in h and 'Surface(' in h:
                  h2 = home.read_text()
                  if 'import androidx.compose.material3.Surface' not in h2:
                      h2 = h2.replace(
                          'import androidx.compose.material3.Switch',
                          'import androidx.compose.material3.Surface\nimport androidx.compose.material3.Switch',
                      )
                  if 'import androidx.compose.ui.unit.sp' not in h2:
                      h2 = h2.replace(
                          'import androidx.compose.ui.unit.dp',
                          'import androidx.compose.ui.unit.dp\nimport androidx.compose.ui.unit.sp',
                      )
                  if 'import androidx.compose.ui.text.style.TextOverflow' not in h2:
                      h2 = h2.replace(
                          'import androidx.compose.ui.text.style.TextAlign',
                          'import androidx.compose.ui.text.style.TextAlign\nimport androidx.compose.ui.text.style.TextOverflow',
                      )
                  home.write_text(h2)
                  print('HomeScreen imports fixed')

          print('Premium patches applied')
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver
          git diff --cached --quiet && echo "No changes" || git commit -m "feat(native): premium UX — active order banner, GO bar, richer cards"
          git push
