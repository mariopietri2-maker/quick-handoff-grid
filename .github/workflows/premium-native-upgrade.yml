name: Premium Native Upgrade
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/premium-native-upgrade.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply premium UX patches
        run: |
          python3 .github/scripts/premium-native-upgrade.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver
          git diff --cached --quiet && echo "No changes" || git commit -m "feat(native): premium UX — active order banner, GO bar, richer cards"
          git push
