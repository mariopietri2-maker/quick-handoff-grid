name: Fix + rebuild all native APKs
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-and-rebuild-native-apks.py"
      - ".github/workflows/fix-and-rebuild-all-native-apks.yml"
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply fixes + version bump
        run: python3 scripts/fix-and-rebuild-native-apks.py

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo no change; else
            git commit -m "fix+chore: repair Google buildConfig, cart snackbar, viva lint; bump native 1.0.10 / 1.0.2"
            git push
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0" "platform-tools"

      - name: Mapbox token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}"
            echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}"
          } >> ~/.gradle/gradle.properties

      - name: Gradle wrappers
        run: |
          for app in native-customer native-driver native-admin; do
            if [ -d "$app" ]; then
              cp -R native-driver/gradle "$app/" 2>/dev/null || true
              cp native-driver/gradlew "$app/" 2>/dev/null || true
              chmod +x "$app/gradlew" 2>/dev/null || true
              echo "sdk.dir=$ANDROID_HOME" > "$app/local.properties"
            fi
          done

      - name: Build customer debug APK
        working-directory: native-customer
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build driver debug APK
        working-directory: native-driver
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build admin debug APK (optional)
        working-directory: native-admin
        continue-on-error: true
        run: |
          if [ -f gradlew ]; then ./gradlew :app:assembleDebug --no-daemon --stacktrace; else echo skip admin; fi

      - name: Collect + upload APKs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist-apks
          cp native-customer/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-customer-native-debug.apk
          cp native-driver/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-driver-native-debug.apk
          if ls native-admin/app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            cp native-admin/app/build/outputs/apk/debug/*.apk dist-apks/fresh2go-admin-native-debug.apk || true
          fi
          ls -lah dist-apks/
          TAG=mobile-apks-v1
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "Fresh2GO native APKs" --notes "Debug sideload builds"
          # replace customer + driver assets
          for name in fresh2go-customer-native-debug.apk fresh2go-driver-native-debug.apk fresh2go-admin-native-debug.apk; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" || true)
            if [ -n "${id:-}" ]; then gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true; fi
          done
          gh release upload "$TAG" dist-apks/*.apk --clobber
          echo "Customer: https://github.com/${{ github.repository }}/releases/download/$TAG/fresh2go-customer-native-debug.apk"
          echo "Driver:   https://github.com/${{ github.repository }}/releases/download/$TAG/fresh2go-driver-native-debug.apk"
