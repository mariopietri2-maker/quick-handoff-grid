name: Production signed AAB 1.0.60 retry
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/prod-signed-aab-1-0-60-retry.yml"
concurrency:
  group: native-play-aabs-1060r
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 scripts/patch_store_visibility_1_0_60.py 2>/dev/null || true
          python3 scripts/patch_customer_playstore_payment_delivery.py 2>/dev/null || true
      - name: Version 1.0.60 / 7238000
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          VER, CODE = "1.0.60", "7238000"
          for rel in ["native-customer/app/build.gradle.kts"]:
              p = Path(rel)
              t = p.read_text()
              t = re.sub(r"versionCode\s*=\s*\d+", f"versionCode = {CODE}", t)
              t = re.sub(r'versionName\s*=\s*"[^"]*"', f'versionName = "{VER}"', t)
              p.write_text(t)
          print(VER, CODE)
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Keystore
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle mobile-signing
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh2go-customer-upload.jks
          cat > mobile-signing/key.properties <<EOF
          storePassword=${PLAY_STORE_PASSWORD}
          keyPassword=${PLAY_KEY_PASSWORD:-$PLAY_STORE_PASSWORD}
          keyAlias=fresh2go-customer
          storeFile=fresh2go-customer-upload.jks
          customerStoreFile=fresh2go-customer-upload.jks
          EOF
      - name: Bundle
        working-directory: native-customer
        env:
          PLAY_KEYSTORE_FILE: ${{ github.workspace }}/mobile-signing/fresh2go-customer-upload.jks
          PLAY_KEY_ALIAS: fresh2go-customer
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cp -R ../native-driver/gradle .
          cp ../native-driver/gradlew ../native-driver/gradlew.bat .
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:bundleRelease --no-daemon --stacktrace
      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          AAB=native-customer/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          cp "$AAB" /tmp/fresh2go-customer-native-signed.aab
          cp "$AAB" /tmp/fresh2go-customer-native-v1.0.60-vc7238000-signed.aab
          gh release view mobile-apks-v1 >/dev/null 2>&1 || gh release create mobile-apks-v1 --title mobile-apks-v1 --notes "native"
          gh release upload mobile-apks-v1 /tmp/fresh2go-customer-native-signed.aab /tmp/fresh2go-customer-native-v1.0.60-vc7238000-signed.aab --clobber
          echo AAB_1_0_60_OK
