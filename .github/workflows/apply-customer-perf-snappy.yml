name: Apply customer perf snappy
on:
  push:
    paths:
      - 'scripts/apply_customer_perf_snappy.py'
      - '.github/workflows/apply-customer-perf-snappy.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_customer_perf_snappy.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/ src/lib/apk-downloads.ts
          git commit -m "perf(customer-native): snappy search + coil + v2.8.6" || exit 0
          git push
