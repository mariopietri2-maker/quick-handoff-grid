name: Web payment methods UI
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-web-payment-methods-ui.py"
      - ".github/workflows/fix-web-payment-ui.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-web-payment-methods-ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/CheckoutPage.tsx
          git commit -m "fix(web): checkout payment methods clarity" || true
          git push || true
