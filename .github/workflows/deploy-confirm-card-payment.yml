name: Deploy confirm-card-payment
on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/confirm-card-payment/**"
      - "supabase/functions/payments-webhook/**"
      - ".github/workflows/deploy-confirm-card-payment.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ojkesspghyqmjmupybva
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add GitHub secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi
          supabase functions deploy confirm-card-payment --project-ref "$PROJECT_REF" --no-verify-jwt
          supabase functions deploy payments-webhook --project-ref "$PROJECT_REF" --no-verify-jwt
          echo "Deployed confirm-card-payment and payments-webhook"
