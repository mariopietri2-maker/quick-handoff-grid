name: Apply Next Wave Kotlin Sources
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode and write next-wave sources
        run: |
          python3 << 'PY'
          import gzip, base64
          from pathlib import Path
          base = Path(".github/parity-payloads/next-wave")

          def load_b64(stem):
              single = base / f"{stem}.kt.gz.b64"
              if single.exists() and single.stat().st_size > 100:
                  return single.read_text().strip()
              parts = sorted(base.glob(f"{stem}.part*.b64"), key=lambda p: int(p.stem.split("part")[-1]))
              if not parts:
                  raise SystemExit(f"missing payload {stem}")
              return "".join(p.read_text().strip() for p in parts)

          mapping = {
            "CustomerShell": "native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt",
            "CustomerViewModel": "native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt",
            "CustomerRepository": "native-customer/app/src/main/java/com/freshdelivery/nativecustomer/data/CustomerRepository.kt",
          }
          for stem, dest in mapping.items():
              b64 = load_b64(stem)
              raw = gzip.decompress(base64.b64decode(b64))
              p = Path(dest)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_bytes(raw)
              print("wrote", dest, len(raw))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git diff --cached --stat
          git commit -m "feat(native): next-wave UI + repo + VM (ratings, favorites, wallet, order-again, filters, promo)" || echo "no changes"
          git push
