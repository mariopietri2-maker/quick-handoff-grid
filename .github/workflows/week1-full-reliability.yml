name: Week1 full reliability + native APKs
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/week1-full-reliability.py"
      - ".github/workflows/week1-full-reliability.yml"
jobs:
  apply-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: python3 scripts/week1-full-reliability.py
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "week1: driver FGS offer ring + store alert + customer track/closed" || true
          git push || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Mapbox
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
      - name: Wrappers
        run: |
          for app in native-customer native-driver; do
            cp -R native-driver/gradle "$app/" 2>/dev/null || true
            cp native-driver/gradlew "$app/" 2>/dev/null || true
            chmod +x "$app/gradlew"
            echo "sdk.dir=$ANDROID_HOME" > "$app/local.properties"
          done
      - name: Build customer
        working-directory: native-customer
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Build driver
        working-directory: native-driver
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp native-customer/app/build/outputs/apk/debug/*.apk dist/fresh2go-customer-native-debug.apk
          cp native-driver/app/build/outputs/apk/debug/*.apk dist/fresh2go-driver-native-debug.apk
          TAG=mobile-apks-v1
          for name in fresh2go-customer-native-debug.apk fresh2go-driver-native-debug.apk; do
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq ".assets[] | select(.name==\"$name\") | .id" || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done
          gh release upload "$TAG" dist/*.apk --clobber
          echo WEEK1_FULL_OK
