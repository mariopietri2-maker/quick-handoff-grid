name: Generate store PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate-store-icons.py"
      - ".github/workflows/generate-store-icons.yml"
      - "public/manifest-store.json"
jobs:
  icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow -q
      - run: python3 scripts/generate-store-icons.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/icons/store-192.png public/icons/store-512.png public/icons/store-180.png public/manifest-store.json
          git commit -m "feat(store-pwa): business-standard storefront icons" || true
          git push || true
