# Build SIGNED Play Store Android App Bundles (.aab) for customer + driver.
# Reuses scripts/build-store-aabs.sh (BG location, FCM sounds, Firebase, push,
# no WebView debug). Play Store requires signed release AABs — debug APKs/AABs
# from build-native-apks.yml are sideload-only.
#
# REQUIRED repo secrets (Settings → Secrets and variables → Actions):
#   PLAY_CUSTOMER_KEYSTORE_B64  base64 of mobile-signing/fresh-customer-upload.jks
#   PLAY_DRIVER_KEYSTORE_B64    base64 of mobile-signing/fresh-driver-upload.jks
#   PLAY_STORE_PASSWORD         storePassword from mobile-signing/key.properties
#   PLAY_KEY_PASSWORD           keyPassword from mobile-signing/key.properties
#   MAPBOX_DOWNLOADS_TOKEN      (driver Mapbox Maps SDK Maven token)
#
# Generate the keystores once on a machine with a JDK:
#   chmod +x scripts/setup-play-signing.sh && ./scripts/setup-play-signing.sh
# Then, e.g.:
#   base64 mobile-signing/fresh-customer-upload.jks   # → PLAY_CUSTOMER_KEYSTORE_B64
#   base64 mobile-signing/fresh-driver-upload.jks     # → PLAY_DRIVER_KEYSTORE_B64
# BACK UP the .jks + key.properties offline. Losing them blocks Play updates.
#
# Alias names come from setup-play-signing.sh: fresh-customer / fresh-driver.

name: Build Signed Play Store AABs

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (must increase). Leave empty for auto (MMDDHHMM)."
        required: false
        default: ""
      version_name:
        description: "Android versionName (default: 1.0.<version_code>)."
        required: false
        default: ""

jobs:
  build-signed-aabs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      PLAY_CUSTOMER_KEYSTORE_B64: ${{ secrets.PLAY_CUSTOMER_KEYSTORE_B64 }}
      PLAY_DRIVER_KEYSTORE_B64: ${{ secrets.PLAY_DRIVER_KEYSTORE_B64 }}
      PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
      PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install npm deps
        run: npm ci

      - name: Fail fast if signing secrets missing
        run: |
          for v in PLAY_CUSTOMER_KEYSTORE_B64 PLAY_DRIVER_KEYSTORE_B64 PLAY_STORE_PASSWORD PLAY_KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::Missing secret ${v} — add it in Settings → Secrets and variables → Actions"
              exit 1
            fi
          done

      - name: Restore keystores + key.properties
        run: |
          set -euo pipefail
          mkdir -p mobile-signing
          echo "$PLAY_CUSTOMER_KEYSTORE_B64" | base64 -d > mobile-signing/fresh-customer-upload.jks
          echo "$PLAY_DRIVER_KEYSTORE_B64"   | base64 -d > mobile-signing/fresh-driver-upload.jks
          cat > mobile-signing/key.properties <<EOF
          customerStoreFile=$(pwd)/mobile-signing/fresh-customer-upload.jks
          customerKeyAlias=fresh-customer
          customerStorePassword=$PLAY_STORE_PASSWORD
          customerKeyPassword=$PLAY_KEY_PASSWORD
          driverStoreFile=$(pwd)/mobile-signing/fresh-driver-upload.jks
          driverKeyAlias=fresh-driver
          driverStorePassword=$PLAY_STORE_PASSWORD
          driverKeyPassword=$PLAY_KEY_PASSWORD
          EOF
          ls -l mobile-signing/

      - name: Mapbox downloads token
        run: |
          TOKEN="${MAPBOX_DOWNLOADS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then
            echo "::warning::MAPBOX_DOWNLOADS_TOKEN secret not set — driver build may fail resolving Mapbox Maps SDK"
          fi
          mkdir -p ~/.gradle
          {
            echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN"
            echo "systemProp.mapboxDownloadsToken=$TOKEN"
          } >> ~/.gradle/gradle.properties
          echo "MAPBOX_DOWNLOADS_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Build web bundle (so cap add finds dist/)
        run: npm run build

      - name: Scaffold Capacitor android dirs (android-customer + android-driver)
        run: |
          set -euo pipefail
          cp capacitor.config.ts capacitor.config.ts.bak
          cp capacitor.customer.config.ts capacitor.config.ts
          npx cap add android
          mv capacitor.config.ts.bak capacitor.config.ts
          cp capacitor.config.ts capacitor.config.ts.bak
          cp capacitor.driver.config.ts capacitor.config.ts
          npx cap add android
          mv capacitor.config.ts.bak capacitor.config.ts
          ls -d android-customer android-driver

      - name: Build signed release AABs
        env:
          APK_VERSION_CODE: ${{ inputs.version_code }}
          APK_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          chmod +x scripts/build-store-aabs.sh scripts/apply-firebase-android.sh
          bash scripts/build-store-aabs.sh

      - name: Verify signatures
        run: |
          set -euo pipefail
          for aab in store-bundles/*.aab; do
            echo "==> $aab"
            "$JAVA_HOME/bin/jarsigner" -verify -certs "$aab" | head -n 5
          done

      - name: Publish to play-store-aabs-v1 GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view play-store-aabs-v1 >/dev/null 2>&1 || \
            gh release create play-store-aabs-v1 --title "Fresh Delivery — Play Store AABs" --notes "Signed release AABs: com.freshdelivery.customer + com.freshdelivery.driver. Upload each in Play Console → Internal testing or Production."
          gh release upload play-store-aabs-v1 store-bundles/*.aab --clobber
          echo "Published to GitHub release play-store-aabs-v1:"
          ls -lah store-bundles/
