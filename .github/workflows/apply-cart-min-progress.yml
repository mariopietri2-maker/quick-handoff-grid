name: Apply cart min progress
on:
  push:
    paths:
      - 'scripts/apply_cart_min_progress.py'
      - '.github/workflows/apply-cart-min-progress.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_cart_min_progress.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/
          git commit -m "feat(customer-native): min-order progress + sticky menu categories" || exit 0
          git push
