name: Run patch active job confirm
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_active_job_confirm.py'
      - '.github/workflows/run-patch-active-job.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_active_job_confirm.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-driver/app/src/main/java/com/freshdelivery/nativedriver/ui/home/HomeScreen.kt
          git commit -m "feat(driver): confirm before completing N-store call" || exit 0
          git push
