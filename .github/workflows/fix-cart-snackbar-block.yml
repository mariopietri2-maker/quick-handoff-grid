name: Fix cart snackbar blocking
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-cart-snackbar-block.py"
      - ".github/workflows/fix-cart-snackbar-block.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 scripts/fix-cart-snackbar-block.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerViewModel.kt \
                  native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          if git diff --staged --quiet; then echo no change; else
            git commit -m "fix(customer-native): add-to-cart haptic only — no blocking snackbar"
            git push
          fi
