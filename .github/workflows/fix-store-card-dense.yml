name: Dense store cards
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-store-card-dense.py"
      - ".github/workflows/fix-store-card-dense.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-store-card-dense.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git commit -m "fix(customer): denser store cards, single delivery chip" || true
          git push || true
