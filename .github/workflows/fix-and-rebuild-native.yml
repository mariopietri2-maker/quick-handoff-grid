name: Fix scan bugs + rebuild native APKs
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-scan-bugs.py"
      - ".github/workflows/fix-and-rebuild-native.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-scan-bugs.py
      - name: Commit
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver || true
          git commit -m "fix: no lat!! crash; driver offer single ring path" || true
          git push || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: SDK
        run: |
          set -euo pipefail
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK_ROOT/cmdline-tools"
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Mapbox
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          mkdir -p ~/.gradle
          echo "MAPBOX_DOWNLOADS_TOKEN=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
          echo "systemProp.mapboxDownloadsToken=${MAPBOX_DOWNLOADS_TOKEN:-}" >> ~/.gradle/gradle.properties
      - name: Wrappers
        run: |
          for app in native-customer native-driver; do
            cp -R native-driver/gradle "$app/" 2>/dev/null || true
            cp native-driver/gradlew "$app/" 2>/dev/null || true
            chmod +x "$app/gradlew"
            echo "sdk.dir=$ANDROID_HOME" > "$app/local.properties"
          done
      - name: Build customer
        id: cust
        continue-on-error: true
        working-directory: native-customer
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/cust.log
          grep -E "^e: " /tmp/cust.log | head -40 || true
      - name: Build driver
        id: drv
        continue-on-error: true
        working-directory: native-driver
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/drv.log
          grep -E "^e: " /tmp/drv.log | head -40 || true
      - name: Upload if built
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=mobile-apks-v1
          ok=0
          if [ -f native-customer/app/build/outputs/apk/debug/*.apk ] || ls native-customer/app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            cp native-customer/app/build/outputs/apk/debug/*.apk /tmp/fresh2go-customer-native-debug.apk
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name=="fresh2go-customer-native-debug.apk") | .id' || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
            gh release upload "$TAG" /tmp/fresh2go-customer-native-debug.apk --clobber
            echo CUSTOMER_OK
            ok=1
          else
            echo CUSTOMER_FAIL
            grep -E "^e: " /tmp/cust.log | head -40 || tail -50 /tmp/cust.log
          fi
          if ls native-driver/app/build/outputs/apk/debug/*.apk 1>/dev/null 2>&1; then
            cp native-driver/app/build/outputs/apk/debug/*.apk /tmp/fresh2go-driver-native-debug.apk
            id=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.assets[] | select(.name=="fresh2go-driver-native-debug.apk") | .id' || true)
            [ -n "${id:-}" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
            gh release upload "$TAG" /tmp/fresh2go-driver-native-debug.apk --clobber
            echo DRIVER_OK
            ok=1
          else
            echo DRIVER_FAIL
            grep -E "^e: " /tmp/drv.log | head -40 || tail -50 /tmp/drv.log
          fi
          [ "$ok" = "1" ] || exit 1
