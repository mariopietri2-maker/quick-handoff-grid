name: Disable Twilio SMS UI
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/disable-twilio-sms-ui.py"
      - ".github/workflows/disable-twilio-sms.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/disable-twilio-sms-ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: disable Twilio SMS verification (provider removed)" || true
          git push || true
