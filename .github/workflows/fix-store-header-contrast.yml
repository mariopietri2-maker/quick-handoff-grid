name: Fix store header contrast
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-store-header-contrast.py"
      - ".github/workflows/fix-store-header-contrast.yml"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-store-header-contrast.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native-customer/app/src/main/java/com/freshdelivery/nativecustomer/ui/CustomerShell.kt
          git commit -m "fix(customer): high-contrast store header chips" || true
          git push || true
