name: Apply fresh2go password-reset allowlist
on:
  push:
    paths:
      - 'scripts/apply_fresh2go_password_reset.py'
      - '.github/workflows/apply-fresh2go-password-reset.yml'
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/apply_fresh2go_password_reset.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/request-password-reset/index.ts
          git commit -m "chore: allow fresh2go.gr in password-reset redirects" || exit 0
          git push
