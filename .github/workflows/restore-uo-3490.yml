name: Restore useOrders from 3490e00
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-uo-3490.yml"
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch
        run: |
          set -euo pipefail
          git show 3490e00c92545d9770264c93074010c94cccb565:src/hooks/useOrders.ts > src/hooks/useOrders.ts
          grep -q pending_offers src/hooks/useOrders.ts
          python3 <<'PY'
          from pathlib import Path
          t = Path('src/hooks/useOrders.ts').read_text(encoding='utf-8')
          # Signature + suppressSound
          if 'opts?: { suppressSound?: boolean }' not in t:
              t = t.replace(
                  'export function useStoreOrders(storeId: string | null) {\n',
                  '''export function useStoreOrders(\n  storeId: string | null,\n  opts?: { suppressSound?: boolean },\n) {\n  const suppressSound = Boolean(opts?.suppressSound);\n  const suppressSoundRef = useRef(suppressSound);\n  suppressSoundRef.current = suppressSound;\n  const autoAcceptRef = useRef(false);\n''',
              )
          if 'const suppressSound' not in t:
              raise SystemExit('suppressSound missing after patch')
          if 'autoAcceptEnabled' not in t:
              t = t.replace(
                  'const [pendingIds, setPendingIds] = useState<string[]>([]);\n',
                  'const [pendingIds, setPendingIds] = useState<string[]>([]);\n  const [autoAcceptEnabled, setAutoAcceptEnabled] = useState(false);\n  autoAcceptRef.current = autoAcceptEnabled;\n',
              )
          # Auto-accept load effect if missing
          if 'store_auto_accept_rules' not in t:
              insert = '''\n  useEffect(() => {\n    if (!storeId) { setAutoAcceptEnabled(false); return; }\n    let cancelled = false;\n    void (supabase as any).from('store_auto_accept_rules').select('enabled').eq('store_id', storeId).maybeSingle()\n      .then(({ data }: any) => { if (!cancelled) setAutoAcceptEnabled(!!data?.enabled); });\n    return () => { cancelled = true; };\n  }, [storeId]);\n'''
              t = t.replace('const ACTIVE_STATUSES = useRef(new Set([\'placed\', \'accepted\', \'preparing\', \'ready\']));\n', 'const ACTIVE_STATUSES = useRef(new Set([\'placed\', \'accepted\', \'preparing\', \'ready\']));\n' + insert)
          t = t.replace('startOrderAlertLoop();', "startOrderAlertLoop({ maxRepeats: (typeof autoAcceptRef !== 'undefined' && autoAcceptRef.current) ? 5 : null });")
          t = t.replace('if (!suppressSound &&', 'if (!suppressSoundRef.current &&')
          t = t.replace('if (!suppressSound) {', 'if (!suppressSoundRef.current) {')
          # Keep ringing effect
          if 'autoAcceptEnabled ? 5' not in t and 'Keep ringing' in t:
              t = t.replace(
                  '''  useEffect(() => {\n    const hasNew = orders.some((o) => o.status === 'placed');\n    if (hasNew) startOrderAlertLoop();\n    else stopOrderAlertLoop();''',
                  '''  useEffect(() => {\n    if (suppressSound) { stopOrderAlertLoop(); return; }\n    const hasNew = orders.some((o) => o.status === 'placed');\n    if (hasNew) startOrderAlertLoop({ maxRepeats: autoAcceptEnabled ? 5 : null });\n    else stopOrderAlertLoop();''',
              )
          if 'pending_offers' not in t:
              raise SystemExit('lost driver')
          Path('src/hooks/useOrders.ts').write_text(t, encoding='utf-8')
          print('lines', len(t.splitlines()))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/hooks/useOrders.ts
          git commit -m "fix: restore useOrders from 3490e00 + suppressSound defined" || true
          git push
