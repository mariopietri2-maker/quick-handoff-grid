name: Remove top cash line
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/fix-receipt-no-top-cash.py"
      - ".github/workflows/fix-receipt-no-top-cash.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/fix-receipt-no-top-cash.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/print-order-escpos.ts src/components/store/PrintOrderTicket.tsx
          git commit -m "fix(print): remove top ΜΕΤΡΗΤΑ amount line" || true
          git push || true
