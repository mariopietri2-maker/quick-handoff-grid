name: Next Wave Premium Native
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/next-wave-premium.yml'

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply next-wave premium features
        run: |
          python3 .github/scripts/next-wave-premium.py

      - name: Commit patches
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add native-customer native-driver
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(native): next-wave premium — ratings, favorites, wallet, order-again APIs, driver earnings/cash/wait banners"
            git push
          fi
