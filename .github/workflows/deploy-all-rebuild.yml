import java.time.DayOfWeek
import java.time.LocalDate
import java.time.LocalDateTime
import kotlinx.serialization.json.booleanOrNull
import kotlinx.serialization.json.contentOrNull
import kotlinx.serialization.json.jsonObject
import kotlinx.serialization.json.jsonPrimitive

fun StoreRow.isOpenForOrders(): Boolean {
    if (is_active == false) return false
    if (busy_mode == true) return false
    val today = LocalDate.now()
    val dateKey = "%04d-%02d-%02d".format(today.year, today.monthValue, today.dayOfMonth)
    if ((holiday_dates ?: emptyList()).any { it.contains(dateKey) }) return false
    val hours = opening_hours ?: return true
    val now = LocalDateTime.now()
    val dayKey = when (now.dayOfWeek) {
        DayOfWeek.MONDAY -> "mon"
        DayOfWeek.TUESDAY -> "tue"
        DayOfWeek.WEDNESDAY -> "wed"
        DayOfWeek.THURSDAY -> "thu"
        DayOfWeek.FRIDAY -> "fri"
        DayOfWeek.SATURDAY -> "sat"
        DayOfWeek.SUNDAY -> "sun"
    }
    val schedule = hours.jsonObject[dayKey] ?: return true
    val obj = schedule.jsonObject
    val enabled = obj["enabled"]?.jsonPrimitive?.booleanOrNull ?: true
    if (!enabled) return false
    val open = obj["open"]?.jsonPrimitive?.contentOrNull ?: return true
    val close = obj["close"]?.jsonPrimitive?.contentOrNull ?: return true
    fun toMin(v: String): Int? {
        val hhmm = v.trim().split(":")
        if (hhmm.size != 2) return null
        return hhmm[0].toIntOrNull()?.times(60)?.plus(hhmm[1].toIntOrNull() ?: 0)
    }
    val openMin = toMin(open) ?: return true
    val closeMin = toMin(close) ?: return true
    val minuteOfDay = now.hour * 60 + now.minute
    return if (closeMin > openMin) minuteOfDay in openMin until closeMin
    else minuteOfDay >= openMin || minuteOfDay < closeMin
}

fun StoreRow.closedReason(): String? {
    if (is_active == false) return "Το κατάστημα είναι ανενεργό."
    if (busy_mode == true) return "Το κατάστημα είναι προσωρινά σε παύση παραγγελιών."
    if (!isOpenForOrders()) return "Το κατάστημα είναι κλειστό αυτή τη στιγμή."
    return null
}
''', encoding='utf-8')

