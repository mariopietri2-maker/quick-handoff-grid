name: Optimize roulette
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/optimize-roulette.py"
      - ".github/workflows/optimize-roulette.yml"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/optimize-roulette.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "perf(games): optimize roulette spin, CTA, 30m prize window" || true
          git push || true
