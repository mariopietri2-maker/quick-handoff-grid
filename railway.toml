# Railway — sole production host for the Fresh Delivery SPA.
# Build: Nixpacks runs `npm ci` + `npm run build` (see package.json).
# SPA fallback is handled by the Railway static/Hikari layer + public/_redirects.

[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
