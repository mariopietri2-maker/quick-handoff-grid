name: Fresh2GOCustomer
options:
  bundleIdPrefix: com.freshdelivery
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
targets:
  Fresh2GOCustomer:
    type: application
    platform: iOS
    sources:
      - path: Fresh2GOCustomer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.freshdelivery.customer
        INFOPLIST_FILE: Fresh2GOCustomer/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
