<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 150" width="400" height="150">
  <defs>
    <linearGradient id="ag-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
    <linearGradient id="ag-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#059669"/>
      <stop offset="100%" style="stop-color:#10b981"/>
    </linearGradient>
  </defs>

  <style>
    @keyframes ag-bounce {
      0%, 100% { transform: translateY(0); }
      40%      { transform: translateY(-6px); }
      70%      { transform: translateY(0); }
    }
    @keyframes ag-handle {
      0%, 100% { transform: translateY(0); }
      40%      { transform: translateY(-3px); }
    }
    @keyframes ag-shimmer {
      0%   { transform: translateX(-80px); }
      60%, 100% { transform: translateX(80px); }
    }
    @keyframes ag-fade {
      0%, 100% { opacity: 0.15; }
      50%      { opacity: 0.5; }
    }
    .ag-icon  { animation: ag-bounce 1.6s ease-in-out infinite; transform-origin: 40px 40px; }
    .ag-handle{ animation: ag-handle 1.6s ease-in-out infinite; transform-origin: 40px 20px; }
    .ag-sheen { animation: ag-shimmer 2.6s ease-in-out infinite; }
    .ag-dot   { animation: ag-fade 1.6s ease-in-out infinite; }
    .ag-dot2  { animation: ag-fade 1.6s ease-in-out infinite .3s; }
    .ag-dot3  { animation: ag-fade 1.6s ease-in-out infinite .6s; }
  </style>

  <!-- Delivery bag icon (animated bounce) -->
  <g class="ag-icon">
    <!-- handle -->
    <path class="ag-handle" d="M25 30 Q40 10 55 30" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round"/>
    <!-- bag body -->
    <rect x="10" y="30" width="60" height="55" rx="7" fill="url(#ag-green)"/>
    <rect x="18" y="38" width="44" height="39" rx="4" fill="white"/>
    <path d="M32 55 L42 55 M37 50 L37 60" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Shimmer sweep across the icon -->
  <g clip-path="url(#ag-clip)" class="ag-sheen">
    <defs>
      <clipPath id="ag-clip">
        <circle cx="40" cy="58" r="38"/>
      </clipPath>
    </defs>
    <rect x="-80" y="30" width="30" height="60" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- Text -->
  <text x="110" y="65" font-family="Inter, Arial, sans-serif" font-size="38" fill="#1f2937" font-weight="700">fresh</text>
  <text x="110" y="105" font-family="Inter, Arial, sans-serif" font-size="38" fill="url(#ag-text)" font-weight="700">2go</text>

  <!-- Motion dots racing to the wordmark -->
  <circle class="ag-dot"  cx="180" cy="98" r="2.5" fill="#10b981"/>
  <circle class="ag-dot2" cx="192" cy="98" r="2.5" fill="#059669"/>
  <circle class="ag-dot3" cx="204" cy="98" r="2.5" fill="#10b981"/>

  <text x="195" y="105" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9ca3af" font-weight="500">.gr</text>
</svg>
